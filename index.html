function exportProfiles(){
  const payload = {
    app:'celestial-tracker', version:1, exportedAt:new Date().toISOString(),
    primaryId:getPrimaryId(), profiles:loadProfiles(),
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'celestial-tracker-profiles-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importProfiles(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ alert('That file isn’t valid JSON — is it a profile export from this app?'); return; }
    const incoming = Array.isArray(data) ? data : data.profiles;
    if(!Array.isArray(incoming) || !incoming.every(p=>p && typeof p.id==='string' && typeof p.date==='string')){
      alert('That doesn’t look like a profile export from this app.'); return;
    }
    const existing = loadProfiles();
    const existingIds = new Set(existing.map(p=>p.id));
    let added=0, updated=0;
    incoming.forEach(p=>{ if(existingIds.has(p.id)) updated++; else added++; upsertProfile(p); });
    // only adopt the imported "this is me" pick if nothing is already set —
    // never silently override a primary designation already made on this device
    if(!getPrimaryId() && data.primaryId && incoming.some(p=>p.id===data.primaryId)){
      setPrimaryId(data.primaryId);
    }
    alert(`Imported: ${added} new, ${updated} updated.`);
    renderProfileList();
  };
  reader.readAsText(file);
}

    setPrimaryId(document.getElementById('pfPrimary').checked ? profile.id : (getPrimaryId()===profile.id ? null : getPrimaryId()));
    jumpToNatalMoment(profile);
    renderProfileView(profile);
  });
  const cancelBtn = document.getElementById('btnCancelEdit');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>renderProfileView(existing));
}

// the natal wheel gets its own dedicated screen (unlike the cast chart, which
// shares the crt with the orbit view), so it can afford to render bigger
const NATAL_R_SCALE = 0.54;
let natalListMode = false;
// persisted across renderProfileView calls (it's re-run every ~0.5s to keep
// transits current) so pinch-zoom/pan and scroll position survive a refresh
// instead of resetting every time — only reset when a DIFFERENT profile opens
let natalZoomState = null;
let natalZoomForId = null;
// refreshOnly=true is used by the periodic tick() refresh that keeps transits
// current as the clock is scrubbed — it only touches the text content and
// redraws onto the EXISTING canvas, leaving the DOM (buttons, canvas element)
// untouched, since rebuilding those every ~0.5s could interrupt a real click
// or an in-progress pinch/pan gesture mid-way through. A full rebuild only
// happens on first open, switching profiles, or the explicit WHEEL/LIST toggle.
function renderProfileView(p, refreshOnly){
  currentNatalView = p;
  compareOpen = false;
  updateNatalJumpBtn();
  if(natalZoomForId !== p.id){ natalZoomState = {z:1, ox:0, oy:0}; natalZoomForId = p.id; }
  const natalState = getNatalState(p);
  const natalAspects = computeAspects(natalState);
  const transits = computeTransitAspects(displayState, natalState);
  // cusps depend only on birth data + the chosen system (not the live
  // clock), so they're cached — see getHouseCusps
  const houseCusps = getHouseCusps(p);
  let placementsHtml = '';
  Object.values(natalState.bodies).forEach(s=>{
    if(s.elon==null) return;
    const z = ZODIAC[s.sign];
    placementsHtml += `<div class="row"><span class="g">${s.glyph}</span><span class="nm">${s.abbr}</span><span class="pos">${z.glyph} ${fmtDeg(s.deg)}</span><span class="house">H${houseOfElon(s.elon, houseCusps)}</span></div>`;
  });
  let transitHtml = '';
  transits.slice(0,16).forEach(tr=>{
    transitHtml += `<div class="transit-row"><span class="g">${tr.t.glyph}</span><span>${tr.aspect.glyph}</span><span class="ng">${tr.n.glyph}</span><b>${tr.t.abbr} ${tr.aspect.abbr} natal ${tr.n.abbr}</b><span class="orb">orb ${fmtDeg(tr.orb)}</span></div>`;
  });
  const isPrimary = p.id===getPrimaryId();
  // transits are tied to whatever moment the main clock is scrubbed to, not
  // always "right now" — show that moment explicitly so it's clear which
  // date the list reflects, and refreshing this often enough (see the tick
  // loop) keeps it in sync as you scrub instead of lagging behind
  const transitDateLabel = displayState.date.toISOString().slice(0,16).replace('T',' ')+' UTC';
  const textPaneHtml = `
    <div class="hd" style="color:var(--phos2)">${esc(p.name)}${isPrimary?' <span class="pme">★︎ ME</span>':''}</div>
    <div class="natal-hint" style="margin-top:0">${esc(p.place)} · ${p.date} ${p.time} (UTC${p.utcOffset>=0?'+':''}${p.utcOffset})</div>
    ${placementsHtml}
    <div class="hd" style="color:var(--phos2); margin-top:16px">TRANSITS — ${transitDateLabel}</div>
    ${transitHtml || '<div class="row">— nothing within orb —</div>'}
  `;

  // the wheel itself no longer draws the fixed birth chart — it shows
  // whatever moment the global DATE/TIME control is on, exactly like the
  // cast-chart tab (see the unthrottled redraw in tick()), so scrubbing moves
  // the wheel live instead of only updating the transits text below. The
  // placements list above stays pinned to the actual natal data; only the
  // wheel is "live". Opening a profile (or the ◎ NATAL button) jumps the
  // clock to its birth moment, which is what makes the wheel show the natal
  // chart in the first place — it's just the live chart, parked on that date.
  const existingCanvas = document.getElementById('canvasNatal');
  if(refreshOnly && existingCanvas){
    const pane = document.querySelector('.natal-text-pane');
    if(pane){
      const prevScrollTop = pane.scrollTop;
      pane.innerHTML = textPaneHtml;
      pane.scrollTop = prevScrollTop;
    }
    return;
  }

  els.natalBody.innerHTML = `
    <div class="natal-viewsplit${natalListMode?' list':''}" id="natalViewSplit">
      <div class="natal-text-pane">${textPaneHtml}</div>
      <canvas id="canvasNatal"></canvas>
    </div>
  `;
  const natalCanvas = document.getElementById('canvasNatal');
  renderWheel(natalCanvas, displayState, computeAspects(displayState), natalZoomState.z, natalZoomState, NATAL_R_SCALE, houseCusps, getNatalAsc(p));
  // re-fetches cusps/asc (cheap — cached) rather than closing over the const
  // above, so cycling the house-system button doesn't leave a pan/zoom-
  // triggered redraw showing the previously-selected system
  attachWheelZoom(natalCanvas, natalZoomState, ()=>renderWheel(natalCanvas, displayState, computeAspects(displayState), natalZoomState.z, natalZoomState, NATAL_R_SCALE, getHouseCusps(p), getNatalAsc(p)));
  // "set as me" used to be its own button here — it's already a checkbox in
  // the edit form ("THIS IS ME"), so this was a redundant second way to do
  // the same thing; folded into editing instead, freeing up a bar slot for
  // the wheel/list toggle
  natalBar(`
    <button class="key" id="btnBackList" style="flex:1">←︎ PROFILES</button>
    <button class="key" id="btnEditThis" style="flex:1">✎︎ EDIT</button>
    <button class="key" id="btnToggleNatalList" style="flex:1">${natalListMode?'◉︎ WHEEL':'☰︎ LIST'}</button>
  `);
  document.getElementById('btnBackList').addEventListener('click', ()=>{ natalBar(defaultNatalBar); renderProfileList(); });
  document.getElementById('btnEditThis').addEventListener('click', ()=>{ natalBar(defaultNatalBar); renderProfileForm(p); });
  document.getElementById('btnToggleNatalList').addEventListener('click', ()=>{ natalListMode=!natalListMode; renderProfileView(p); });

// ---------- chart comparison (2-4 people overlaid, concentric rings) ----------
const COMPARE_MAX = 4;
// only the 4 "major" aspects get a checkbox here — this panel is about
// surfacing the big cross-chart hits at a glance, not every minor tie
const COMPARE_ASPECTS = ASPECTS.filter(a=>['CONJUNCTION','TRINE','SQUARE','OPPOSITION'].includes(a.name));
let compareEntries = [];       // current {id,name,color,state}[] set of PEOPLE, refreshed by renderCompare
let compareActive = {};        // id -> shown/hidden on the wheel
let compareAspectOn = {CONJUNCTION:true, TRINE:true, SQUARE:true, OPPOSITION:true};
let compareHighlight = 'all';  // 'all' or a comparePairKey()
let compareViewMode = 'wheel'; // 'wheel' | 'list' | 'filters'
let compareLastMode = 'wheel'; // which of wheel/list to return to when filters closes
let compareZoomState = null;
let compareZoomForKey = null;  // resets everything above when the picked id-set changes
let compareOpen = false;       // true only while a compare screen (any of wheel/list/filters) is showing
let compareFocusKey = null;    // body key "pinned" by a tap/click — persists until tapped again
let compareHoverKey = null;    // transient mouse-hover preview (desktop only), takes priority while active
function compareEffectiveKey(){ return compareHoverKey || compareFocusKey; }
let compareKeyAlpha = {};      // body key -> current fade alpha (0..1)
let compareFadeRAF = null;
let compareDotHitboxes = [];   // [{key,x,y}] canvas-CSS px, refreshed every wheel render
let redrawCompareWheelFn = null;

// "Transiting" is a 5th, optional entry (off by default) that isn't one of
// the picked people — it's whatever the global DATE/TIME control is on
// (displayState), always rebuilt fresh so it moves live as you scrub, and
// drawn as the outermost ring (real people keep their own fixed birth
// data/order). Everything downstream — visibility, aspect lines, the
// highlight-pair list, tap-to-reveal — treats it as just another entry, so
// none of that logic needed to change to support it.
const TRANSIT_ID = '__transit__';
const TRANSIT_COLOR = '#f2f2f0';
function getCompareEntries(){
  if(!compareActive[TRANSIT_ID]) return compareEntries;
  return [{id:TRANSIT_ID, name:'Transiting', color:TRANSIT_COLOR, state:displayState}, ...compareEntries];
}

function comparePairKey(idA, idB){ return [idA,idB].sort().join('|'); }
function compareVisibleEntries(){ return getCompareEntries().filter(e=>compareActive[e.id]!==false); }
// every cross-chart aspect among currently-visible people, filtered by the
// aspect-type checkboxes and the highlight-pair picker — this is the
// "eligible" set; tapping a planet then fades in just its slice of it
function computeCompareAspects(){
  const visible = compareVisibleEntries();
  const out = [];
  for(let i=0;i<visible.length;i++){
    for(let j=i+1;j<visible.length;j++){
      const eA=visible[i], eB=visible[j];
      if(compareHighlight!=='all' && compareHighlight!==comparePairKey(eA.id,eB.id)) continue;
      computeTransitAspects(eA.state, eB.state).forEach(tr=>{
        if(!compareAspectOn[tr.aspect.name]) return;
        out.push({...tr, entryA:eA, entryB:eB});
      });
    }
  }
  out.sort((a,b)=>a.orb-b.orb);
  return out;
}
function ensureCompareAlpha(key){ if(!(key in compareKeyAlpha)) compareKeyAlpha[key]=0; return compareKeyAlpha[key]; }
function stopCompareFade(){ if(compareFadeRAF){ cancelAnimationFrame(compareFadeRAF); compareFadeRAF=null; } }
function startCompareFade(){
  if(compareFadeRAF) return;
  function step(){
    let settled = true;
    const eff = compareEffectiveKey();
    const keys = new Set(Object.keys(compareKeyAlpha));
    if(eff) keys.add(eff);
    keys.forEach(k=>{
      const target = k===eff ? 1 : 0;
      let a = ensureCompareAlpha(k);
      a += (target-a)*0.22;
      if(Math.abs(target-a)<0.01) a=target; else settled=false;
      compareKeyAlpha[k]=a;
    });
    if(redrawCompareWheelFn) redrawCompareWheelFn();
    compareFadeRAF = settled ? null : requestAnimationFrame(step);
  }
  compareFadeRAF = requestAnimationFrame(step);
}
// tap (any pointer) toggles a planet's aspects on/off; hover (mouse only, no
// button held) previews it without needing a click — both just call
// setCompareFocus, layered on top of attachWheelZoom's own pan/pinch listeners
// on the same canvas (a plain tap still nudges pan by a sub-pixel amount,
// same trade-off the orbit view's tap-vs-drag already makes)
function attachCompareTapFocus(canvas){
  let tapStart = null;
  function hitTest(x,y){
    let best=null, bestD=18;
    compareDotHitboxes.forEach(h=>{
      const d = Math.hypot(h.x-x, h.y-y);
      if(d<bestD){ bestD=d; best=h.key; }
    });
    return best;
  }
  canvas.addEventListener('pointerdown', e=>{ tapStart = {x:e.clientX, y:e.clientY, id:e.pointerId}; });
  canvas.addEventListener('pointermove', e=>{
    if(tapStart && e.pointerId===tapStart.id && Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>6) tapStart=null;
    // hover is its own transient preview, independent of the tap-pinned focus
    // below — otherwise the mouse-move Chrome fires just before a click's
    // pointerdown pre-sets focus to that dot, and the click's own toggle then
    // immediately reads it as "already focused" and un-toggles it right back off
    if(e.pointerType==='mouse' && e.buttons===0){
      const rect = canvas.getBoundingClientRect();
      const key = hitTest(e.clientX-rect.left, e.clientY-rect.top);
      if(key!==compareHoverKey){ compareHoverKey=key; startCompareFade(); }
    }
  });
  canvas.addEventListener('pointerleave', ()=>{ if(compareHoverKey){ compareHoverKey=null; startCompareFade(); } });
  function endTap(e){
    if(tapStart && e.pointerId===tapStart.id){
      const rect = canvas.getBoundingClientRect();
      const key = hitTest(e.clientX-rect.left, e.clientY-rect.top);
      if(key){ compareFocusKey = (compareFocusKey===key?null:key); startCompareFade(); }
    }
    tapStart = null;
  }
  canvas.addEventListener('pointerup', endTap);
  canvas.addEventListener('pointercancel', ()=>{ tapStart=null; });
}

function renderCompare(ids){
  currentNatalView = null;
  compareOpen = true;
  const list = loadProfiles();
  const profiles = ids.map(id=>list.find(p=>p.id===id)).filter(Boolean);
  if(profiles.length<2) return;

  const zoomKey = ids.join(',');
  if(compareZoomForKey !== zoomKey){
    compareActive = {}; ids.forEach(id=>compareActive[id]=true); compareActive[TRANSIT_ID]=false;
    compareAspectOn = {CONJUNCTION:true, TRINE:true, SQUARE:true, OPPOSITION:true};
    compareHighlight = 'all';
    compareFocusKey = null;
    compareHoverKey = null;
    compareKeyAlpha = {};
    compareViewMode = 'wheel'; compareLastMode = 'wheel';
    compareZoomState = {z:1, ox:0, oy:0};
    compareZoomForKey = zoomKey;
  }
  compareEntries = profiles.map((p,i)=>({id:p.id, name:p.name||'Unnamed', color:OVERLAY_COLORS[i%OVERLAY_COLORS.length], state:getNatalState(p)}));
  renderCompareBody();
}

function renderCompareBody(){
  if(compareViewMode==='filters') renderCompareFilters();
  else if(compareViewMode==='list') renderCompareListView();
  else renderCompareWheelView();

  const filtersOn = compareViewMode==='filters';
  const otherMode = (filtersOn?compareLastMode:compareViewMode);
  natalBar(`
    <button class="key" id="btnBackFromCompare" style="flex:1">←︎ PROFILES</button>
    <button class="key" id="btnCompareFilters" style="flex:1">${filtersOn?'✕︎ CLOSE':'⚙︎ FILTERS'}</button>
    <button class="key" id="btnCompareToggleView" style="flex:1">${otherMode==='list'?'◉︎ WHEEL':'☰︎ LIST'}</button>
  `);
  document.getElementById('btnBackFromCompare').addEventListener('click', ()=>{
    stopCompareFade(); compareOpen=false; natalBar(defaultNatalBar); renderProfileList();
  });
  document.getElementById('btnCompareFilters').addEventListener('click', ()=>{
    if(!filtersOn) stopCompareFade();
    compareViewMode = filtersOn ? compareLastMode : 'filters';
    renderCompareBody();
  });
  document.getElementById('btnCompareToggleView').addEventListener('click', ()=>{
    stopCompareFade();
    const targetMode = otherMode==='list' ? 'wheel' : 'list';
    compareViewMode = targetMode; compareLastMode = targetMode;
    renderCompareBody();
  });
}

function renderCompareWheelView(){
  els.natalBody.innerHTML = `<div class="natal-viewsplit"><canvas id="canvasOverlay"></canvas></div>`;
  const overlayCanvas = document.getElementById('canvasOverlay');
  // getCompareEntries() (not compareEntries directly) so that if Transiting
  // is toggled on, each call picks up whatever displayState is current —
  // that's what makes its ring move live as the global clock is scrubbed
  redrawCompareWheelFn = ()=>renderOverlayWheel(overlayCanvas, getCompareEntries(), compareActive, compareZoomState.z, compareZoomState);
  redrawCompareWheelFn();
  // the CSS grid/flex layout that gives this canvas its final size (the
  // .natal-body:has(.natal-viewsplit) rule swapping out padding, in
  // particular) hasn't necessarily been applied yet on this same synchronous
  // tick right after the innerHTML swap — fitCanvas's very first
  // getBoundingClientRect read can come back with a taller-than-actual
  // backing store, which throws off every dot's hit-test position until the
  // next redraw. One extra measure-and-redraw next frame, before any tap can
  // land, keeps that first tap accurate instead of only self-correcting later.
  requestAnimationFrame(redrawCompareWheelFn);
  attachWheelZoom(overlayCanvas, compareZoomState, redrawCompareWheelFn);
  attachCompareTapFocus(overlayCanvas);
}

function renderCompareListView(){
  const visible = compareVisibleEntries();
  const keys = Object.keys(visible[0]?.state.bodies||{}).filter(k=>k!=='earth');
  let table = '<div class="hcell"></div>'+visible.map(e=>`<div class="hcell" style="color:${e.color}">${esc(e.name)}</div>`).join('');
  keys.forEach(k=>{
    const first = visible[0].state.bodies[k];
    if(first.elon==null) return;
    table += `<div class="g">${first.glyph}</div>`+visible.map(e=>{
      const b = e.state.bodies[k];
      return `<div>${ZODIAC[b.sign].glyph} ${fmtDeg(b.deg)}${b.retro?' ℞︎':''}</div>`;
    }).join('');
  });

  const aspectRows = computeCompareAspects().slice(0,24).map(tr=>
    `<div class="transit-row"><span class="g">${tr.t.glyph}</span><span>${tr.aspect.glyph}</span><span class="ng">${tr.n.glyph}</span><b><span style="color:${tr.entryA.color}">${esc(tr.entryA.name)}</span> ${tr.t.abbr} ${tr.aspect.abbr} <span style="color:${tr.entryB.color}">${esc(tr.entryB.name)}</span> ${tr.n.abbr}</b><span class="orb">orb ${fmtDeg(tr.orb)}</span></div>`
  ).join('') || '<div class="row">— nothing within orb —</div>';

  els.natalBody.innerHTML = `
    <div class="natal-body-pad">
      <div class="hd" style="color:var(--phos2)">${visible.map(e=>`<span style="color:${e.color}">${esc(e.name)}</span>`).join(' × ')}</div>
      <div class="compare-table" style="grid-template-columns:2ch repeat(${Math.max(visible.length,1)},1fr)">${table}</div>
      <div class="hd" style="color:var(--phos2); margin-top:16px">CROSS-CHART ASPECTS${visible.length>2?' (all visible pairs)':''}</div>
      ${aspectRows}
    </div>
  `;
}

function renderCompareFilters(){
  const dotsHtml = compareEntries.map((e,i)=>{
    const on = compareActive[e.id]!==false;
    return `<button class="cmp-dot${on?'':' off'}" data-id="${e.id}" style="color:${e.color}"><span class="sw"></span>${BODY_SLOT_LETTERS[i]||''} ${esc(e.name)}</button>`;
  }).join('')
  // Transiting isn't a picked person (no letter slot) — it's the live sky,
  // off by default, toggled on the same way as everyone else
  + `<button class="cmp-dot${compareActive[TRANSIT_ID]?'':' off'}" data-id="${TRANSIT_ID}" style="color:${TRANSIT_COLOR}"><span class="sw"></span>◐ Transiting</button>`;

  const aspectChecks = COMPARE_ASPECTS.map(a=>
    `<label><input type="checkbox" class="cmpAspectChk" data-name="${a.name}" ${compareAspectOn[a.name]?'checked':''}> ${a.glyph} ${a.name[0]+a.name.slice(1).toLowerCase()}</label>`
  ).join('');

  const visible = compareVisibleEntries();
  let highlightOptions = `<label><input type="radio" name="cmpHi" value="all" ${compareHighlight==='all'?'checked':''}> Everyone</label>`;
  for(let i=0;i<visible.length;i++){
    for(let j=i+1;j<visible.length;j++){
      const key = comparePairKey(visible[i].id, visible[j].id);
      highlightOptions += `<label><input type="radio" name="cmpHi" value="${key}" ${compareHighlight===key?'checked':''}> <span style="color:${visible[i].color}">${esc(visible[i].name)}</span> ↔ <span style="color:${visible[j].color}">${esc(visible[j].name)}</span></label>`;
    }
  }

  const strongest = computeCompareAspects().slice(0,8).map(tr=>
    `<div class="row"><span class="g">${tr.t.glyph}</span><span>${tr.aspect.glyph}</span><span class="g">${tr.n.glyph}</span><span style="flex:1">${esc(tr.t.name)} ${tr.aspect.glyph} ${esc(tr.n.name)}</span><span class="orb">${fmtDeg(tr.orb)}</span></div>`
  ).join('') || '<div class="natal-hint">— nothing within orb yet —</div>';

  els.natalBody.innerHTML = `
    <div class="natal-body-pad">
      <div class="hd" style="color:var(--phos2)">SHOW</div>
      <div class="cmp-dots">${dotsHtml}</div>
      <div class="hd" style="color:var(--phos2)">ASPECTS</div>
      <div class="cmp-check-row">${aspectChecks}</div>
      <div class="hd" style="color:var(--phos2)">HIGHLIGHT</div>
      <div class="cmp-radio-row">${highlightOptions}</div>
      <div class="hd" style="color:var(--phos2)">STRONGEST ASPECTS</div>
      ${strongest}
      <div class="natal-hint">Tap (or hover, on desktop) a planet on the wheel to reveal just its cross-chart aspects.</div>
    </div>
  `;
  document.querySelectorAll('.cmp-dot').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      compareActive[id] = !(compareActive[id]!==false);
      renderCompareFilters();
    });
  });
  document.querySelectorAll('.cmpAspectChk').forEach(cb=>{
    cb.addEventListener('change', ()=>{ compareAspectOn[cb.dataset.name]=cb.checked; renderCompareFilters(); });
  });
  document.querySelectorAll('input[name="cmpHi"]').forEach(r=>{
    r.addEventListener('change', ()=>{ if(r.checked){ compareHighlight=r.value; renderCompareFilters(); } });
  });
}

function bodyOptions(list, selected){

// resize the picked-bodies list to n slots, keeping existing picks and filling
// any new slots with the first bodies not already in use
function fitBodySlots(n, existing){
  const result = (existing||[]).slice(0,n);
  for(const b of SEARCHABLE_BODIES){
    if(result.length>=n) break;
    if(!result.includes(b.key)) result.push(b.key);
  }
  return result;
}

function renderSearchView(){
  const s = searchState;
  const asp = SEARCH_ASPECTS.find(a=>a.key===s.aspectKey);
  const typeFields = {
    cazimi: `<label class="full">PLANET<select id="srBodyA">${bodyOptions(CAZIMI_BODIES, s.bodyA)}</select></label>`,
    aspect: `
      <label class="full">ASPECT<select id="srAspect">${SEARCH_ASPECTS.map(a=>`<option value="${a.key}" ${a.key===s.aspectKey?'selected':''}>${a.glyph} ${a.name}${a.bodies>2?` (${a.bodies} bodies)`:''}</option>`).join('')}</select></label>
      ${s.bodies.slice(0,asp.bodies).map((bk,i)=>`<label>BODY ${BODY_SLOT_LETTERS[i]}<select id="srBody${i}">${bodyOptions(SEARCHABLE_BODIES, bk)}</select></label>`).join('')}
    `,
    station: `<label class="full">PLANET<select id="srBodyA">${bodyOptions(RETRO_BODIES, s.bodyA)}</select></label>`,
    ingress: `<label class="full">BODY<select id="srBodyA">${bodyOptions(SEARCHABLE_BODIES, s.bodyA)}</select></label>`,
  };
  els.searchBody.innerHTML = `
    <div class="natal-body-pad">
      <div class="hd" style="color:var(--phos2)">SEARCH DATES</div>
      <div class="natal-form">
        <label class="full">LOOKING FOR
          <select id="srType">
            <option value="cazimi" ${s.type==='cazimi'?'selected':''}>CAZIMI — exact Sun conjunction</option>
            <option value="aspect" ${s.type==='aspect'?'selected':''}>ASPECT / PATTERN between bodies</option>
            <option value="station" ${s.type==='station'?'selected':''}>STATION — turns retrograde/direct</option>
            <option value="ingress" ${s.type==='ingress'?'selected':''}>INGRESS — enters a new sign</option>
          </select>
        </label>
        ${typeFields[s.type]}
        <label class="full">FROM<input type="datetime-local" id="srFrom" value="${s.from}"></label>
        <label class="full">TO<input type="datetime-local" id="srTo" value="${s.to}"></label>
        <button class="key full" id="btnRunSearch" style="grid-column:1/-1">⌕︎ SEARCH</button>
      </div>
      <div class="natal-hint">Scans day by day and narrows every hit down to the minute. CAZIMI marks the exact planet–Sun conjunction; tradition treats anything within 17′ of this moment as cazimi. GRAND TRINE/T-SQUARE/YOD/GRAND CROSS are alignments that hold over a window rather than one instant, so those report the tightest moment in each window instead.</div>
      <div id="searchResults" style="margin-top:14px"></div>
    </div>
  `;
  document.getElementById('srType').addEventListener('change', e=>{ searchState.type=e.target.value; renderSearchView(); });
  const bodyA = document.getElementById('srBodyA'); if(bodyA) bodyA.addEventListener('change', e=>searchState.bodyA=e.target.value);
  const aspectSel = document.getElementById('srAspect');
  if(aspectSel) aspectSel.addEventListener('change', e=>{
    searchState.aspectKey = e.target.value;
    const n = SEARCH_ASPECTS.find(a=>a.key===searchState.aspectKey).bodies;
    searchState.bodies = fitBodySlots(n, searchState.bodies);
    renderSearchView();
  });
  if(s.type==='aspect'){
    s.bodies.slice(0,asp.bodies).forEach((_,i)=>{
      document.getElementById('srBody'+i).addEventListener('change', e=>{ searchState.bodies[i]=e.target.value; });
    });
  }
  document.getElementById('srFrom').addEventListener('change', e=>searchState.from=e.target.value);
  document.getElementById('srTo').addEventListener('change', e=>searchState.to=e.target.value);
  document.getElementById('btnRunSearch').addEventListener('click', runSearch);
}

function runSearch(){
  const s = searchState;
  const from = new Date(document.getElementById('srFrom').value);
  const to = new Date(document.getElementById('srTo').value);
  const out = document.getElementById('searchResults');
  if(!(from<to)){ out.innerHTML = '<div class="natal-hint">End date must be after the start date.</div>'; return; }
  if(to-from > 6*365*86400000){ out.innerHTML = '<div class="natal-hint">Keep the range under 6 years — searches get slow beyond that.</div>'; return; }
  let asp = null;
  if(s.type==='aspect'){
    asp = SEARCH_ASPECTS.find(a=>a.key===s.aspectKey);
    const picked = s.bodies.slice(0,asp.bodies);
    if(new Set(picked).size !== picked.length){ out.innerHTML = '<div class="natal-hint">Pick a different body for each slot.</div>'; return; }
  }
  out.innerHTML = '<div class="natal-hint">SEARCHING…</div>';
  setTimeout(()=>{
    let hits = [];
    if(s.type==='cazimi'){
      hits = searchAspectDates(s.bodyA,'sun',0,from,to).map(h=>({date:h.date, label:`${bodyLabel(s.bodyA)} CAZIMI (exact ☉︎ conjunction)`}));
    } else if(s.type==='aspect'){
      const picked = s.bodies.slice(0,asp.bodies);
      if(asp.bodies===2){
        hits = searchAspectDates(picked[0],picked[1],asp.angle,from,to).map(h=>({date:h.date, label:`${bodyLabel(picked[0])} ${asp.glyph} ${asp.name} ${bodyLabel(picked[1])}`}));
      } else {
        hits = searchPatternDates(picked,asp.gaps,asp.orb,from,to).map(h=>({date:h.date, label:`${asp.name}: ${picked.map(bodyLabel).join(' · ')}`}));
      }
    } else if(s.type==='station'){
      hits = searchStationDates(s.bodyA,from,to).map(h=>({date:h.date, label:`${bodyLabel(s.bodyA)} STATION ${h.turningRetro?'RETROGRADE':'DIRECT'}`}));
    } else if(s.type==='ingress'){
      hits = searchIngressDates(s.bodyA,from,to).map(h=>({date:h.date, label:`${bodyLabel(s.bodyA)} → ${ZODIAC[h.sign].glyph} ${ZODIAC[h.sign].name}`}));
    }
    renderSearchResults(hits);
  }, 30);
}

function renderSearchResults(hits){
  const out = document.getElementById('searchResults');
  if(!hits.length){ out.innerHTML = '<div class="natal-hint">Nothing found in that range.</div>'; return; }
  out.innerHTML = hits.map((h,i)=>{
    const when = h.date.toISOString().slice(0,16).replace('T',' ')+' UTC';
    return `<div class="search-hit" data-idx="${i}"><span class="when">${when} — tap for chart</span><span class="what">${h.label}</span></div>`;
  }).join('');
  out.querySelectorAll('.search-hit').forEach((row,i)=>{
    row.addEventListener('click', ()=>{
      leaveLive();
      goToDate(hits[i].date, true);
      showView('chart');
    });
  });
}

document.getElementById('btnSearch').addEventListener('click', ()=>showView('search'));
renderSearchView(); // search tab's content persists across tab switches, like the other views

// ---------- tap a body in the orbit view: zoom the camera in on it in place,
// with a small floating card for its info, instead of leaving for a new screen ----------
let focusedBodyKey = null;
// panFade (0..1) scales render3d's pan independently of zoom — pan's raw
// magnitude is proportional to zoom, but at zoom=1 that's the target's
// natural (non-zero) offset from center, not zero, so tying pan directly to
// the zoom tween meant it visibly snapped from "natural offset" to "exactly
// zero" the instant closing finished. Fading pan itself to 0 makes the return
// to the normal view smooth all the way through instead of jumping at the end.
let panFade = 0;
let camZoomTween = null; // {fromZoom,toZoom,fromFade,toFade,start,dur,onDone}
function animateZoom(toZoom, toFade, dur, onDone){
  camZoomTween = {fromZoom:cam.zoom, toZoom, fromFade:panFade, toFade, start:performance.now(), dur:dur||700, onDone};
}
function renderFocusCard(key){
  const b = BODY_DEFS.find(x=>x.key===key);
  const s = displayState.bodies[key];
  const posHtml = s.elon!=null
    ? `${ZODIAC[s.sign].glyph} ${ZODIAC[s.sign].name} ${fmtDeg(s.deg)}${s.retro?' · ℞︎ RETRO':''}`
    : 'heliocentric — no geocentric position';
  const rulesHtml = BODY_RULES[key] ? `<div class="planetcard-rules">RULES: ${BODY_RULES[key]}</div>` : '';
  const aspects = computeAspects(displayState).filter(a=>a.a.key===key || a.b.key===key).slice(0,4);
  const aspectsHtml = aspects.map(a=>{
    const other = a.a.key===key ? a.b : a.a;
    return `<div>${a.aspect.glyph} ${a.aspect.abbr} ${other.glyph} ${other.abbr} <span style="opacity:.6">${fmtDeg(a.orb)}</span></div>`;
  }).join('') || '<div style="opacity:.6">nothing within orb</div>';
  els.planetCard.innerHTML = `
    <div class="planetcard-name" style="color:${b.color}">${b.glyph} ${b.name}</div>
    <div class="planetcard-meaning">${BODY_MEANING[key]||''}</div>
    ${rulesHtml}
    <div class="planetcard-pos">${posHtml}</div>
    <div class="planetcard-aspects">${aspectsHtml}</div>
  `;
}
function focusOnBody(key){
  focusedBodyKey = key;
  cam.autorotate = false;
  animateZoom(4, 1, 700);
  renderFocusCard(key);
  els.planetCard.classList.add('on');
  els.readout.classList.remove('on'); // the placements list just clutters a close-up
}
function closeFocus(){
  els.planetCard.classList.remove('on');
  els.readout.classList.add('on');
  // keep focusedBodyKey set through the zoom-out so pan has something to fade
  // from — clearing it immediately would drop pan to 0 in one frame instead
  // of over the animation
  animateZoom(1, 0, 500, ()=>{ focusedBodyKey = null; });
}

// ================= main loop =================
function updateNowClock(){
  const d = displayState.date;
  els.nowClock.textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  els.nowSub.textContent = (liveMode?'LIVE · ':'')+d.toLocaleDateString([], {year:'numeric',month:'short',day:'2-digit'});
}
function updateRail(state, aspects){
  els.moonPhaseVal.innerHTML = moonPhaseLabel(state);
  const tight = aspects[0];
  els.tightAspectVal.textContent = tight ? `${tight.a.abbr} ${tight.aspect.glyph} ${tight.b.abbr}` : '—';
  const retro = Object.values(state.bodies).filter(s=>s.retro).map(s=>s.abbr);
  els.retroListVal.textContent = retro.length ? retro.join(' ') : 'none';
  els.ticker.innerHTML = retro.length ? `<b>${retro.length} RETROGRADE</b> · ${retro.join(', ')}` : 'ALL BODIES DIRECT';

  const primary = getPrimaryProfile();
  if(primary){
    const natalState = getNatalState(primary);
    const personal = computeTransitAspects(state, natalState)[0];
    els.yourDayVal.textContent = personal
      ? `${personal.t.abbr} ${personal.aspect.glyph} natal ${personal.n.abbr} · orb ${fmtDeg(personal.orb)}`
      : 'nothing tight right now';
  } else {
    els.yourDayVal.textContent = '— set your chart under NATAL/TRANSITS —';
  }
}

let frameCount = 0;
function tick(now){
  if(tween){
    const t = Math.min(1, (now-tween.start)/tween.dur);
    displayState = interpState(tween.from, tween.to, t);
    if(t>=1) tween=null;
  } else if(liveMode && now-lastLiveRecompute > 30000){
    displayState = computeState(new Date());
    lastLiveRecompute = now;
  }
  if(camZoomTween){
    const t = Math.min(1, (now-camZoomTween.start)/camZoomTween.dur);
    const e = easeInOutQuad(t);
    cam.zoom = camZoomTween.fromZoom + (camZoomTween.toZoom-camZoomTween.fromZoom)*e;
    panFade = camZoomTween.fromFade + (camZoomTween.toFade-camZoomTween.fromFade)*e;
    if(t>=1){ const onDone=camZoomTween.onDone; camZoomTween=null; if(onDone) onDone(); }
  }

  render3d(displayState); // always-on galaxy backdrop, regardless of which overlay is active
  if(activeView==='chart'){
    const chartAspects = computeAspects(displayState);
    renderWheel(els.canvasChart, displayState, chartAspects, chartZoom.z, chartZoom);
    if(printChartOnce){ renderChartPrint(displayState, chartAspects); printChartOnce = false; }
  }
  // the natal wheel is just a second live chart, parked on whatever moment
  // the clock is on — redrawn every frame like the cast chart above (not
  // throttled with the text refresh below) so dragging the scrub slider
  // moves it smoothly instead of in ~333ms steps
  if(els.natalview.classList.contains('on') && currentNatalView && !natalListMode){
    const natalCanvas = document.getElementById('canvasNatal');
    if(natalCanvas) renderWheel(natalCanvas, displayState, computeAspects(displayState), natalZoomState.z, natalZoomState, NATAL_R_SCALE, getHouseCusps(currentNatalView), getNatalAsc(currentNatalView));
  }
  // same idea for chart comparison's optional Transiting ring — only matters
  // while it's actually toggled on, but redrawCompareWheelFn already no-ops
  // cheaply otherwise (getCompareEntries() just returns the same array)
  if(els.natalview.classList.contains('on') && compareOpen && compareViewMode==='wheel' && redrawCompareWheelFn){
    redrawCompareWheelFn();
  }

  if(frameCount % 15 === 0){
    const aspects = renderReadout(displayState);
    updateRail(displayState, aspects);
    updateNatalJumpBtn();
  }
  if(frameCount % 20 === 0 && els.natalview.classList.contains('on') && currentNatalView){
    renderProfileView(currentNatalView, true);
  }
  // list/filters are plain text, not a persistent canvas — only worth
  // rebuilding on a tick while Transiting is live, otherwise nothing here
  // depends on the clock and it would just be wasted work
  if(frameCount % 20 === 0 && els.natalview.classList.contains('on') && compareOpen && compareActive[TRANSIT_ID]){
    if(compareViewMode==='list') renderCompareListView();
    else if(compareViewMode==='filters') renderCompareFilters();
  }
  if(frameCount % 90 === 0 && focusedBodyKey){
    renderFocusCard(focusedBodyKey);
  }
  updateNowClock();
  frameCount++;
  requestAnimationFrame(tick);
}

// init
els.dtInput.value = toLocalDatetimeInputValue(new Date());
lastLiveRecompute = performance.now();
function updateHouseSystemBtn(){
  document.getElementById('btnHouseSystem').textContent = HOUSE_SYSTEMS.find(s=>s.key===getHouseSystem()).label;
}
document.getElementById('btnHouseSystem').addEventListener('click', ()=>{
  cycleHouseSystem();
  updateHouseSystemBtn();
  // only the natal wheel is affected — redraw it immediately if it's open
  // rather than waiting for the next tick (house cusps don't otherwise
  // change every frame, so there's no other redraw already coming)
  if(els.natalview.classList.contains('on') && currentNatalView && !natalListMode){
    const natalCanvas = document.getElementById('canvasNatal');
    if(natalCanvas) renderWheel(natalCanvas, displayState, computeAspects(displayState), natalZoomState.z, natalZoomState, NATAL_R_SCALE, getHouseCusps(currentNatalView), getNatalAsc(currentNatalView));
  }
});
updateHouseSystemBtn();
requestAnimationFrame(tick);
})();
</script>
