<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CELESTIAL TRACKER CT-12</title>
<style>
  :root{
    color-scheme:dark;
    --room:#0c0a12;
    --chassis:#c9c2d6; --chassis-hi:#e9e4f2; --chassis-lo:#5d5670; --chassis-deep:#3c3750;
    --screen:#0a0812; --phos:#7dd3ff; --phos-dim:#3f6f80; --phos-faint:#1e3540;
    --phos2:#b490ff; --phos2-dim:#5a4980; --phos2-faint:#2c2440;
    --amber:#ffb000; --amber-dim:#8a6420;
    --led-red:#d6452b; --led-red-off:#4d2a22; --led-amb:#ffb000; --led-amb-off:#4d3a17;
    --ink:#2a2438;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--room);
    background-image:radial-gradient(ellipse 90% 70% at 50% 15%, #191430 0%, var(--room) 70%);
    min-height:100vh; min-height:100dvh; display:flex; align-items:safe center; justify-content:center;
    font-family:var(--mono); padding:28px 14px; box-sizing:border-box; color:var(--ink);
    font-variant-emoji:text; /* planet/zodiac glyphs are astrological symbols, not emoji — belt-and-suspenders alongside the U+FE0E on each glyph */
  }
  .console{
    background:linear-gradient(175deg,var(--chassis-hi) 0%,var(--chassis) 30%,#a89fc0 100%);
    border-radius:14px; padding:22px 24px 18px;
    box-shadow:0 2px 0 var(--chassis-hi) inset, 0 -3px 0 var(--chassis-lo) inset,
      0 24px 60px rgba(0,0,0,.65), 0 4px 12px rgba(0,0,0,.5);
    width:min(920px,100%); box-sizing:border-box;
    display:grid; grid-template-columns:1fr 236px; column-gap:18px;
    grid-template-areas:
      "name  name"
      "now   now"
      "crt   rail"
      "time  time"
      "trans trans"
      "foot  foot"
      "sig   sig";
  }
  .legend{
    font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.5); font-weight:700;
  }
  .nameplate{grid-area:name; display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap}
  .nameplate .brand{font-size:17px; letter-spacing:.3em; font-weight:800; color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .nameplate .brand small{font-weight:400; letter-spacing:.22em; font-size:10px; color:#544d68}
  .crt-bezel{grid-area:crt}
  .rail{grid-area:rail}
  .now{grid-area:now}
  .timepanel{grid-area:time}
  .signature{grid-area:sig}
  @media(max-width:760px){
    .console{
      grid-template-columns:1fr;
      grid-template-areas:
        "name" "now" "crt" "time" "rail" "trans" "foot" "sig";
    }
  }

  /* ---------- CRT ---------- */
  .crt-bezel{
    background:linear-gradient(180deg,#4a4460,#302c40);
    border-radius:12px; padding:12px;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 -2px 6px rgba(0,0,0,.6) inset, 0 1px 0 var(--chassis-hi);
  }
  .crt{
    position:relative; background:var(--screen); border-radius:8px; height:460px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.9) inset, 0 0 4px rgba(125,211,255,.14) inset;
  }
  @media(max-width:760px){
    .crt{height:min(340px, 44vh, 44dvh)}
    .readout{width:auto; height:55%; bottom:auto}
    /* the chart bar needs its own room too, same idea as the desktop rule below —
       otherwise it has to steal room from the canvas, which then centers its circle
       higher than the backdrop starfield behind it (drawn on the un-shrunk canvas3d)
       does, so the two circles visibly don't share a center */
    .crt:has(.chartview.on){height:calc(min(340px, 44vh, 44dvh) + 52px)}
    .crt:has(.readout.on){height:calc(min(340px, 44vh, 44dvh) + 60px)}
    .crt:has(.natalview.on){height:calc(min(340px, 44vh, 44dvh) + 60px)}
  }
  /* the chart wheel needs real room to avoid crowding — grow the console for it on desktop */
  @media(min-width:820px){
    .console:has(.chartview.on), .console:has(.natalview.on), .console:has(.searchview.on){ width:min(1180px,100%) }
    .crt:has(.chartview.on), .crt:has(.natalview.on), .crt:has(.searchview.on), .crt:has(.readout.on){ height:680px }
  }
  .crt::after{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:8px; z-index:3;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .crt::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:4; border-radius:8px;
    background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, transparent 22%);
  }
  /* the galaxy is the permanent backdrop of the whole CRT — always rendering, both the
     orbit view and the chart wheel are just different overlays layered on top of it */
  #canvas3d{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab}
  #canvas3d.dragging{cursor:grabbing}

  /* independently-scrollable placement list, docked left over the galaxy —
     fully transparent, no seam, so it reads as part of the same black screen as the canvas */
  /* pointer-events was previously split (none on the container, auto only on
     .hd/.row/.arow) so a tap in the GAPS between rows would fall through to
     the canvas underneath and still reach the Sun/planets. But that also
     meant only those gaps were scrollable by touch — dragging with a finger
     that happened to land on a row's own text never scrolled at all, since
     the row itself had no scroll logic of its own and the touch was consumed
     right there. The container is auto again (scrolling works everywhere,
     not just the gaps); a dedicated tap-through handler below (see
     attachReadoutTapThrough) restores "tap reaches the Sun/planets"
     without needing pointer-events tricks. */
  .readout{
    position:absolute; inset:0; width:210px; padding:10px 12px 34px; overflow-y:auto; box-sizing:border-box;
    background:transparent; border:none; display:none;
    color:var(--phos); font-size:11px; line-height:1.35;
    text-shadow:0 0 6px rgba(125,211,255,.5), 0 1px 3px rgba(0,0,0,.9);
    /* fade the last ~36px instead of a hard cut where the list meets the
       bottom edge of the crt */
    -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 36px), transparent 100%);
    mask-image:linear-gradient(to bottom, #000 calc(100% - 36px), transparent 100%);
  }
  .readout.on{display:block}
  .readout .hd{color:var(--phos2); letter-spacing:.18em; font-size:10px; margin:8px 0 3px; text-shadow:0 0 6px rgba(180,144,255,.6)}
  .readout .hd:first-child{margin-top:0}
  /* tighter than the natal/chart text panels — this list lives in a narrow permanent sidebar */
  .readout .row{gap:5px}
  .readout .row .g{width:1.8ch; font-size:16px}
  .readout .row .nm{width:5.5ch}
  .readout .row .pos{width:auto; font-size:10.5px}
  .readout .arow{gap:4px; flex-wrap:wrap}
  .readout .arow .g{font-size:13px}
  .readout .arow b{font-size:10.5px}
  .readout .arow .orb{font-size:9px; margin-left:0} /* base .arow .orb pushes it flush right with margin-left:auto — too far from its own row once this list gets narrow and wraps */
  .row{display:flex; gap:8px; align-items:baseline; white-space:nowrap}
  .row .g{width:2.8ch; font-size:28px}
  .row .nm{width:9ch; color:var(--phos-dim)}
  .row .pos{width:14ch; font-variant-numeric:tabular-nums; font-size:14px}
  .row .r{color:var(--led-red); text-shadow:0 0 6px rgba(214,69,43,.7); font-size:11px; letter-spacing:.08em}
  .row .house{color:var(--phos2-dim); font-size:10px; letter-spacing:.06em; margin-left:auto}
  .arow{display:flex; gap:8px; align-items:baseline}
  .arow .g{font-size:24px}
  .arow .orb{color:var(--phos-dim); font-size:11px; margin-left:auto}
  .arow b{color:var(--phos2); font-weight:400; font-size:13px}

  .tuning{
    position:absolute; inset:0; z-index:5; background:var(--screen); display:none;
    align-items:center; justify-content:center; color:var(--phos); font-size:12px;
    letter-spacing:.3em; text-shadow:0 0 10px rgba(125,211,255,.8);
  }
  .tuning.on{display:flex; animation:staticFlicker .4s steps(3) 2}
  @keyframes staticFlicker{ 0%,100%{opacity:1} 50%{opacity:.3} }

  .ticker{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    background:rgba(10,8,18,.92); border-top:1px solid var(--phos-faint);
    color:var(--phos-dim); font-size:11px; letter-spacing:.12em; padding:5px 16px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ticker b{color:var(--phos); font-weight:400}

  /* chart wheel — transparent canvas layered right over the always-rendering galaxy
     backdrop, so the orbit view is visible through the wedge gaps behind the aspects.
     The placement/aspect list used to sit as a translucent overlay on top of this at
     all times, which fought with the wheel for legibility — it's now a separate full-
     panel view you toggle to instead, same idea as the WHEEL/LIST switch on a real
     chart-casting console. */
  .chartview{position:absolute; inset:0; z-index:6; display:none; box-sizing:border-box}
  .chartview.on{display:block}
  /* stop above the button bar rather than running full-bleed underneath it, so the
     wheel centers on what's actually visible instead of a taller area that's partly
     covered — and touch-action:none so a pinch drives OUR zoom instead of the
     browser's native page-zoom gesture grabbing it first */
  .chartview canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
  .chartview .chart-print{
    display:none; position:absolute; inset:0; bottom:52px; box-sizing:border-box;
    background:var(--screen); padding:14px 16px; overflow-y:auto;
    color:var(--phos2); font-size:13px; line-height:1.8; text-shadow:0 0 6px rgba(180,144,255,.5);
  }
  .chartview.list canvas{display:none}
  .chartview.list .chart-print{display:block}
  .chart-print .line{opacity:0; animation:printIn .25s ease-out forwards}
  .chart-print .pg{font-size:22px; display:inline-block; vertical-align:middle}
  @keyframes printIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:translateY(0)}}
  .chart-bar{position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px; padding:8px 12px; background:rgba(10,8,18,.6)}

  /* natal / transits overlay */
  .natalview{position:absolute; inset:0; z-index:6; background:var(--screen); display:none; flex-direction:column; box-sizing:border-box; color:var(--phos2)}
  .natalview.on{display:flex}
  .searchview{position:absolute; inset:0; z-index:6; background:var(--screen); display:none; flex-direction:column; box-sizing:border-box; color:var(--phos2)}
  .searchview.on{display:flex}
  /* floating HUD for a tapped orbit-view body — no card/box, just glowing text
     anchored beside the actual zoomed-in planet and repositioned every frame
     to track it, like a callout in a game rather than a docked panel */
  /* white/near-white throughout, with a strong dark halo — the panel-standard
     purple (--phos2) reads fine on a solid dark background elsewhere in the
     app, but this HUD floats directly over a bright, busy starfield/planet
     render where it just disappeared */
  .planetcard{
    position:absolute; top:14px; left:14px; z-index:7; width:220px; box-sizing:border-box;
    color:#fff; display:none; pointer-events:none;
  }
  .planetcard.on{display:block}
  .planetcard-name{font-size:22px; font-weight:800; letter-spacing:.06em; text-shadow:0 0 16px currentColor, 0 0 4px currentColor, 0 1px 3px #000}
  .planetcard-meaning{font-size:11px; font-style:italic; color:rgba(255,255,255,.8); margin-top:3px; line-height:1.45; text-shadow:0 1px 3px #000, 0 0 6px #000}
  .planetcard-rules{font-size:11px; font-weight:800; letter-spacing:.08em; margin-top:6px; text-shadow:0 1px 3px #000, 0 0 6px #000}
  .planetcard-pos{font-size:11.5px; margin-top:7px; text-shadow:0 1px 3px #000, 0 0 6px #000}
  .planetcard-aspects{margin-top:7px; font-size:11px; line-height:1.7; text-shadow:0 1px 3px #000, 0 0 6px #000}
  .search-hit{display:flex; flex-direction:column; gap:2px; padding:8px 0; border-bottom:1px solid var(--phos2-faint); cursor:pointer}
  .search-hit:hover{color:#fff}
  .search-hit .when{color:var(--phos2-dim); font-variant-numeric:tabular-nums; font-size:10px; letter-spacing:.06em}
  .search-hit .what{font-size:13px}
  .natal-body{flex:1; min-height:0; overflow-y:auto; padding:14px 16px; box-sizing:border-box}
  .natal-form{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; max-width:420px}
  .natal-form label{display:flex; flex-direction:column; gap:4px; font-size:10px; letter-spacing:.12em; color:var(--phos2-dim)}
  .natal-form input{
    font-family:var(--mono); font-size:13px; color:var(--phos2); background:var(--screen);
    border:1px solid var(--phos2-faint); border-radius:4px; padding:7px 8px;
    box-shadow:0 0 8px rgba(0,0,0,.7) inset; text-shadow:0 0 5px rgba(180,144,255,.5); color-scheme:dark;
  }
  .natal-form .full{grid-column:1/-1}
  .natal-hint{font-size:10px; line-height:1.6; color:var(--phos2-dim); max-width:420px; margin-top:10px}
  .transit-row{display:flex; gap:8px; align-items:baseline; font-size:13px; line-height:2; text-shadow:0 0 6px rgba(180,144,255,.5)}
  .transit-row .g{font-size:24px; width:2.6ch; color:var(--phos)}
  .transit-row .ng{font-size:24px; width:2.6ch}
  .transit-row .orb{color:var(--phos2-dim); font-size:11px; margin-left:auto}
  .transit-row b{color:var(--phos2); font-weight:400}
  .natal-bar{display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--phos2-faint); background:rgba(10,8,18,.9)}
  .natal-bar .key{padding:6px 8px}
  .natal-top{display:flex; gap:0; height:100%}
  .natal-top .natal-text{flex:none; width:280px; overflow-y:auto; padding:14px 16px; box-sizing:border-box}
  .natal-top canvas{flex:1; min-width:0; border-left:1px solid var(--phos2-faint); touch-action:none}
  @media(max-width:760px){ .natal-top{flex-direction:column} .natal-top .natal-text{width:auto; max-height:160px} .natal-top canvas{width:100%; height:260px; border-left:none; border-top:1px solid var(--phos2-faint)} }
  /* single-person profile view: wheel and list used to be squeezed side by
     side (or stacked on mobile, 160px text + 260px canvas + the bar all
     jammed into one short crt) — now a WHEEL/LIST toggle like the cast chart,
     so whichever one is showing gets the full body to itself */
  .natal-viewsplit{height:100%; position:relative}
  .natal-viewsplit canvas{display:block; width:100%; height:100%; touch-action:none}
  .natal-viewsplit .natal-text-pane{display:none; height:100%; overflow-y:auto; overscroll-behavior:contain; padding:14px 16px; box-sizing:border-box}
  .natal-viewsplit.list canvas{display:none}
  .natal-viewsplit.list .natal-text-pane{display:block}
  /* .natal-body itself is also overflow-y:auto (needed for the plain profile
     list/edit form panels), but the viewsplit already brings its own full-size
     scrollable pane — two nested auto-scrollers of the same size fought each
     other on mobile (scroll could rubber-band/chain into the outer one) and
     doubled up the padding around the list text. Once a viewsplit is showing,
     let it own scrolling and the full body outright. */
  .natal-body:has(.natal-viewsplit){overflow:hidden; padding:0}
  .profile-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--phos2-faint); font-size:12px}
  .profile-row .pname{flex:1; min-width:0}
  .profile-row .pname b{color:var(--phos2); font-weight:400}
  .profile-row .pmeta{color:var(--phos2-dim); font-size:10px; display:block}
  .profile-row .pme{color:var(--amber); font-size:10px; margin-left:6px}
  .profile-row .pbtn{cursor:pointer; border:1px solid var(--phos2-faint); border-radius:3px; padding:4px 8px; font-size:10px; letter-spacing:.08em; white-space:nowrap}
  .profile-row .pbtn:hover{border-color:var(--phos2-dim); color:#fff}
  /* compact management-list card: name+datetime on one line, place below,
     view/edit/delete underneath — separate from .profile-row (the compare
     picker's checkbox list) so that layout isn't disturbed */
  .profile-card{padding:10px 0; border-bottom:1px solid var(--phos2-faint); font-size:12px}
  .profile-card .pcard-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .profile-card .pname{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left}
  .profile-card .pname b{color:var(--phos2); font-weight:400}
  .profile-card .pme{color:var(--amber); font-size:10px; margin-left:6px}
  /* birth data (date/time + place) as one right-anchored block beside the
     name, instead of place sitting on its own full-width line below */
  .profile-card .pbirth{flex:none; text-align:right; display:flex; flex-direction:column; gap:2px}
  .profile-card .pdatetime{color:var(--phos2-dim); font-size:10.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .profile-card .pplace{color:var(--phos2-dim); font-size:10px; white-space:nowrap}
  .profile-card .pcard-btns{display:flex; gap:8px; margin-top:8px}
  .profile-card .pbtn{cursor:pointer; border:1px solid var(--phos2-faint); border-radius:3px; padding:4px 8px; font-size:10px; letter-spacing:.08em; white-space:nowrap}
  .profile-card .pbtn:hover{border-color:var(--phos2-dim); color:#fff}
  .compare-pick{display:flex; align-items:center; gap:6px; font-size:11px}
  .compare-table{display:grid; grid-template-columns:3ch 1fr 1fr; gap:6px 10px; font-size:13px; align-items:baseline}
  .compare-table .hcell{color:var(--phos2-dim); font-size:10px; letter-spacing:.1em; border-bottom:1px solid var(--phos2-faint); padding-bottom:4px; margin-bottom:2px}
  .compare-table .g{font-size:22px}
  .cmp-dots{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .cmp-dot{display:flex; align-items:center; gap:6px; cursor:pointer; background:none; border:1px solid transparent; border-radius:4px; padding:4px 8px; font-family:var(--mono); font-size:11.5px; color:currentColor}
  .cmp-dot .sw{width:11px; height:11px; border-radius:50%; flex:none; background:currentColor; box-shadow:0 0 6px currentColor}
  .cmp-dot.off{opacity:.5}
  .cmp-dot.off .sw{background:transparent; border:1.5px solid currentColor; box-shadow:none}
  .cmp-check-row, .cmp-radio-row{display:flex; flex-direction:column; gap:7px; margin:6px 0 16px; font-size:12.5px}
  .cmp-check-row label, .cmp-radio-row label{display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--phos2)}
  .cmp-check-row input, .cmp-radio-row input{width:auto}

  /* ---------- right rail ---------- */
  .rail{display:flex; flex-direction:column; gap:14px}
  .now{
    background:var(--screen); border-radius:8px; padding:12px 16px 10px; margin-bottom:14px;
    box-shadow:0 0 14px rgba(0,0,0,.8) inset; color:var(--phos); text-shadow:0 0 8px rgba(125,211,255,.6);
    text-align:center;
  }
  .now-clock{font-size:20px; font-weight:800; letter-spacing:.04em; font-variant-numeric:tabular-nums}
  .now-sub{font-size:11px; letter-spacing:.1em; color:var(--phos-dim); margin-top:4px}
  /* the house-system toggle lives where LIVE/RETRO/ASPECT used to (those
     were redundant with the header clock + the rail cards just below) —
     a single tap cycles Placidus -> Whole Sign -> Equal House -> Koch */
  .housesys-btn{
    width:100%; font-family:var(--mono); font-size:11px; letter-spacing:.12em; font-weight:700;
    color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.5); text-align:center; cursor:pointer;
    background:linear-gradient(180deg,#f6e8c8,#e0c894); border:1px solid #9a7a3a; border-radius:4px;
    padding:8px 6px; box-shadow:0 2px 0 #9a7a3a, 0 1px 0 rgba(255,255,255,.7) inset;
  }
  .housesys-btn:active{transform:translateY(2px); box-shadow:0 0 0 #9a7a3a, 0 1px 0 rgba(255,255,255,.5) inset}
  .rail-block{background:linear-gradient(180deg,#dcd6ea,#c3bcd9); border-radius:8px; padding:10px 10px 8px; box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 -1px 0 rgba(0,0,0,.15) inset, 0 1px 3px rgba(0,0,0,.25)}
  .rail-block .legend{margin-bottom:6px; display:block}
  .rail-block .val{font-size:12px; color:var(--ink)}

  /* ---------- time panel ---------- */
  .timepanel{background:var(--screen); border-radius:8px; padding:12px 16px; margin-top:14px; box-shadow:0 0 14px rgba(0,0,0,.8) inset}
  .time-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  /* NOW and NATAL are a single unit that wraps together as a pair — without
     this they're just two more flex children on .time-row, so on a narrow
     phone (where dtInput alone can eat the whole first line) NATAL could
     wrap onto its own row while NOW stays put, splitting a pair that's
     meant to be read/used together */
  .now-natal-group{display:flex; gap:10px; flex-wrap:nowrap}
  .time-row input[type=datetime-local]{
    font-family:var(--mono); font-size:12px; color:var(--phos); background:var(--screen);
    border:1px solid var(--phos-faint); border-radius:4px; padding:6px 8px;
    box-shadow:0 0 8px rgba(0,0,0,.7) inset; text-shadow:0 0 5px rgba(125,211,255,.5); color-scheme:dark;
  }
  .time-row input[type=range]{flex:1; min-width:140px; accent-color:var(--phos)}
  .jumpkey{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; font-weight:700; color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.5); background:linear-gradient(180deg,#e8e2f6,#c8c0e0);
    border:1px solid #7a7294; border-radius:3px; padding:7px 9px; cursor:pointer;
    box-shadow:0 2px 0 #7a7294, 0 1px 0 rgba(255,255,255,.7) inset;
  }
  .jumpkey:active{transform:translateY(2px); box-shadow:0 0 0 #7a7294, 0 1px 0 rgba(255,255,255,.5) inset}
  .jumpkey.now{color:#1a3a1a; background:linear-gradient(180deg,#cdeecd,#a8d8a8); border-color:#4a8a4a}
  .jumpkey.natal{color:#2a2050; background:linear-gradient(180deg,#dcd4f6,#b8ace0); border-color:#6a5a94}
  .offset-val{font-size:11px; color:var(--phos-dim); min-width:8ch; text-align:right}

  /* ---------- transport ---------- */
  .transport{grid-area:trans; margin-top:18px; border-top:2px solid rgba(0,0,0,.12); padding-top:14px; box-shadow:0 1px 0 rgba(255,255,255,.45)}
  .transport-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:6px}
  .key{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; font-weight:700;
    color:var(--ink); text-shadow:0 1px 0 rgba(255,255,255,.5); text-align:center; cursor:pointer;
    background:linear-gradient(180deg,#e8e2f6,#c8c0e0); border:1px solid #7a7294; border-radius:3px;
    padding:9px 10px 8px; box-shadow:0 3px 0 #7a7294, 0 1px 0 rgba(255,255,255,.7) inset;
    transition:transform .05s, box-shadow .05s; width:100%; box-sizing:border-box;
  }
  .key:active, .key.down{transform:translateY(3px); box-shadow:0 0 0 #7a7294, 0 1px 0 rgba(255,255,255,.5) inset}
  .signature{text-align:center; margin-top:10px; font-size:11px; letter-spacing:.35em; font-weight:800; color:#847c9c}

  @media(max-width:520px){
    body{padding:8px}
    .console{padding:12px 14px 10px; border-radius:10px}
    .nameplate .brand{font-size:14px; letter-spacing:.22em}
    .now-clock{font-size:16px}
    .time-row{gap:6px}
    .jumpkey{padding:6px 7px; font-size:9px}
  }
</style>

<div class="console" id="console" role="application" aria-label="Celestial Tracker real-time astrology console">
  <div class="nameplate">
    <div class="brand">CELESTIAL TRACKER <small>MODEL CT-12</small></div>
  </div>

  <div class="now" id="now">
    <div class="now-clock" id="nowClock">--:--:--</div>
    <div class="now-sub" id="nowSub">SYNCING…</div>
  </div>

  <div class="crt-bezel">
    <div class="crt" id="crt">
      <canvas id="canvas3d"></canvas>
      <div class="readout on" id="readout"></div>
      <div class="tuning" id="tuning">RE-SYNC…</div>
      <div class="chartview" id="chartview">
        <canvas id="canvasChart"></canvas>
        <div class="chart-print" id="chartPrint"></div>
        <div class="chart-bar">
          <button class="key" id="btnChartMode" style="flex:1">☰︎ LIST VIEW</button>
          <button class="key" id="btnExportChart" style="flex:1">⭳︎ EXPORT PNG</button>
        </div>
      </div>
      <div class="natalview" id="natalview">
        <div class="natal-body" id="natalBody"></div>
        <div class="natal-bar"></div>
      </div>
      <div class="searchview" id="searchview">
        <div class="natal-body" id="searchBody"></div>
      </div>
      <div class="planetcard" id="planetCard"></div>
      <div class="ticker" id="ticker">STANDBY</div>
    </div>
  </div>

  <div class="rail">
    <button class="housesys-btn" id="btnHouseSystem">PLACIDUS</button>
    <div class="rail-block">
      <span class="legend">Moon phase</span>
      <div class="val" id="moonPhaseVal">—</div>
    </div>
    <div class="rail-block">
      <span class="legend">Tightest aspect</span>
      <div class="val" id="tightAspectVal">—</div>
    </div>
    <div class="rail-block">
      <span class="legend">Retrograde now</span>
      <div class="val" id="retroListVal">—</div>
    </div>
    <div class="rail-block" id="yourDayBlock">
      <span class="legend">Your day</span>
      <div class="val" id="yourDayVal">— set your chart under NATAL/TRANSITS —</div>
    </div>
  </div>
  <datalist id="cityList"></datalist>

  <div class="timepanel">
    <div class="time-row">
      <span class="legend">Date/Time</span>
      <input type="datetime-local" id="dtInput">
      <div class="now-natal-group">
        <button class="jumpkey now" id="btnNow">◉︎ NOW</button>
        <button class="jumpkey natal" id="btnNatalJump" style="display:none">◎︎ NATAL</button>
      </div>
    </div>
    <div class="time-row" style="margin-top:8px">
      <button class="jumpkey" id="btnMinYear">−1Y</button>
      <button class="jumpkey" id="btnMinMonth">−1M</button>
      <button class="jumpkey" id="btnMinDay">−1D</button>
      <input type="range" id="scrub" min="-365" max="365" value="0" step="1">
      <button class="jumpkey" id="btnPlusDay">+1D</button>
      <button class="jumpkey" id="btnPlusMonth">+1M</button>
      <button class="jumpkey" id="btnPlusYear">+1Y</button>
      <span class="offset-val" id="offsetVal">+0d</span>
    </div>
  </div>

  <div class="transport">
    <div class="transport-row">
      <button class="key" id="btnView3d">◈︎ ORBIT VIEW</button>
      <button class="key" id="btnCastChart">▦︎ CAST CHART</button>
      <button class="key" id="btnNatal">☍︎ NATAL/TRANSITS</button>
      <button class="key" id="btnSearch">⌕︎ SEARCH DATES</button>
    </div>
  </div>
  <div class="signature">NEEFF</div>
</div>

function shadeHex(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const clamp = v => Math.max(0, Math.min(255, v));
  const r = clamp(((n>>16)&255) + amt*255);
  const g = clamp(((n>>8)&255) + amt*255);
  const b = clamp((n&255) + amt*255);
  return `rgb(${r|0},${g|0},${b|0})`;
}

function degToSign(elon){
  const s = Math.floor(((elon%360)+360)%360/30);
  const d = (((elon%360)+360)%360) - s*30;
  return {sign:s, deg:d};
}
function fmtDeg(d){
  const dd = Math.floor(d);
  const mm = Math.floor((d-dd)*60);
  return dd+'°'+String(mm).padStart(2,'0')+"'";

// mean lunar node — the standard (non-oscillating) model almost all consumer
// astrology software defaults to, vs. the "true" node which wobbles around
// this with the Moon's actual perturbations. Standard series (Meeus); checked
// against Swiss Ephemeris's own SE_MEAN_NODE for several dates spanning
// decades, agreeing to within ~0.004° each time.
function meanLunarNodeLon(jd){
  const T = (jd - 2451545.0)/36525;
  const om = 125.04452 - 1934.136261*T + 0.0020708*T*T + (T*T*T)/450000;
  return ((om%360)+360)%360;
}
// ---------- per-body position at a given moment ----------
function bodyPosition(b, time, jd, earthHelioECL){
  if(b.type==='sun'){
    const sp = A.SunPosition(time);
    return {elon:sp.elon, elat:sp.elat, helioECL:{x:0,y:0,z:0}};
  }
  if(b.type==='moon'){
    const mp = A.EclipticGeoMoon(time);
    return {elon:mp.lon, elat:mp.lat, helioECL:earthHelioECL};
  }
  if(b.type==='earth'){
    return {elon:null, elat:null, helioECL:earthHelioECL};
  }
  if(b.type==='node'){
    // always exactly on the ecliptic (elat=0) by definition — a node IS the
    // crossing point of the Moon's orbital plane with the ecliptic. Not a
    // physical body, so no helioECL of its own (parked at the origin like
    // the Sun; excluded from the orbit view's draw list entirely, same as
    // the Sun is drawn separately rather than through that list)
    const lon = ((meanLunarNodeLon(jd) + (b.nodeOffset||0)) % 360 + 360) % 360;
    return {elon:lon, elat:0, helioECL:{x:0,y:0,z:0}};
  }
  if(b.type==='real'){
    const ecl = A.Ecliptic(A.GeoVector(b.body, time, true));
    const helioECL = eqjToEcl(A.HelioVector(b.body, time));
    return {elon:ecl.elon, elat:ecl.elat, helioECL};
  }
  // asteroid / centaur — hand-rolled two-body Kepler, ecliptic J2000 frame
  const helio = keplerHelioECL(b.elem, jd);
  const gx = helio.x-earthHelioECL.x, gy = helio.y-earthHelioECL.y, gz = helio.z-earthHelioECL.z;
  let elon = Math.atan2(gy,gx)/DEG; if(elon<0) elon += 360;
  const elat = Math.atan2(gz, Math.hypot(gx,gy))/DEG;
  return {elon, elat, helioECL:helio};
}
function earthHelioECLAt(time){ return eqjToEcl(A.HelioVector(AB.Earth, time)); }

function computeState(date){
  const time = A.MakeTime(date);
  const jd = dateToJD(date);
  const earthHelioECL = earthHelioECLAt(time);
  const prevDate = new Date(date.getTime()-86400000);
  const prevTime = A.MakeTime(prevDate);
  const prevEarthHelioECL = earthHelioECLAt(prevTime);
  const prevJD = jd-1;

  const bodies = {};
  BODY_DEFS.forEach(b=>{
    const pos = bodyPosition(b, time, jd, earthHelioECL);
    let retro = false;
    if(b.trackRetro!==false){
      const prevPos = bodyPosition(b, prevTime, prevJD, prevEarthHelioECL);
      const dLon = ((pos.elon - prevPos.elon + 540)%360)-180;
      retro = dLon < 0;
    }
    const sd = pos.elon==null ? null : degToSign(pos.elon);
    bodies[b.key] = {
      key:b.key, name:b.name, glyph:b.glyph, abbr:b.abbr, color:b.color,
      elon:pos.elon, elat:pos.elat, helioECL:pos.helioECL, retro,
      sign: sd?sd.sign:null, deg: sd?sd.deg:null,
    };
  });
  return {date:new Date(date.getTime()), jd, bodies, earthHelioECL};
}

function computeAspects(state){
  const keys = Object.keys(state.bodies).filter(k=>k!=='earth');
  const out = [];
  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){
      const a=state.bodies[keys[i]], b=state.bodies[keys[j]];
      let diff = Math.abs(a.elon-b.elon)%360;
      if(diff>180) diff = 360-diff;
      let best=null, bestOrb=Infinity;
      for(const asp of ASPECTS){
        const orb = Math.abs(diff-asp.angle);
        if(orb<=asp.orb && orb<bestOrb){ best=asp; bestOrb=orb; }
      }
      if(best) out.push({a,b,aspect:best,orb:bestOrb});
    }
  }
  out.sort((x,y)=>x.orb-y.orb);
  return out;
}

// Ascendant/Midheaven from local sidereal time (RAMC), obliquity and geographic

// (in degrees) since computeHouseCusps below needs it to derive the other
// house systems' cusps without re-deriving sidereal time itself.
function computeAngles(dateUTC, lat, lon){

  // independent test charts — the un-negated ascY/ascX below had been
  // computing the Descendant (exactly 180° off) the whole time
  const ascY = Math.cos(ramc);
  const ascX = -(Math.sin(ramc)*Math.cos(eps) + Math.tan(phi)*Math.sin(eps));
  let asc = Math.atan2(ascY,ascX)/DEG;
  if(asc<0) asc += 360;
  return {asc, mc, ramc: ramc/DEG};
}

// ---------- house systems ----------
// Placidus & Koch both need iterative solving. The formulas here are
// cross-referenced against multiple independent public derivations (all
// agreeing on the same RAMC+{30,60,120,150} seeds/targets and coefficients),
// since a sign/quadrant slip is the classic house-system bug. Sanity-checked
// at latitude 0, where every system degenerates to simple RA trisection (the
// diurnal/nocturnal semi-arcs are equal everywhere on the equator) — Placidus
// and Koch both collapse to that same case there (verified against this
// implementation directly, since no iteration is needed at lat=0: the seed
// value itself is already the fixed point).
const HOUSE_SYSTEMS = [
  {key:'placidus', label:'PLACIDUS'},
  {key:'whole',    label:'WHOLE SIGN'},
  {key:'equal',    label:'EQUAL HOUSE'},
  {key:'koch',     label:'KOCH'},
];
function normDeg(d){ return ((d%360)+360)%360; }
// right ascension (deg) -> ecliptic longitude (deg), for a point ON the
// ecliptic (latitude 0) — same relation already used above for MC
function raToEclipticLon(raDeg, eps){
  const ra = raDeg*DEG;
  return normDeg(Math.atan2(Math.sin(ra), Math.cos(ra)*Math.cos(eps))/DEG);
}
// the inverse conversion — ecliptic longitude (deg) -> right ascension (deg),
// needed to find the Ascendant's own RA (its OA isn't simply RAMC+90)
function eclipticLonToRA(lonDeg, eps){
  const lon = lonDeg*DEG;
  return normDeg(Math.atan2(Math.sin(lon)*Math.cos(eps), Math.cos(lon))/DEG);
}
function declOfEclipticLon(lonDeg, eps){
  return Math.asin(Math.sin(eps)*Math.sin(lonDeg*DEG))/DEG;
}
function ascensionalDiff(latDeg, declDeg){
  const x = Math.max(-1, Math.min(1, Math.tan(latDeg*DEG)*Math.tan(declDeg*DEG)));
  return Math.asin(x)/DEG;
}
// semi-arc (time-based) trisection — cusps 11/12 divide the MC->ASC diurnal
// semi-arc, cusps 2/3 divide the ASC->IC nocturnal semi-arc (hence the
// "180 - .../F" reflection: arccos naturally returns the diurnal-side arc, so
// the nocturnal side is that arc measured back from the opposite angle)
function solvePlacidusCusp(seedRA, ramc, latDeg, eps, quadrantFlip, F){
  let ra = seedRA;
  for(let i=0;i<20;i++){
    const sign = quadrantFlip ? 1 : -1;
    const x = Math.max(-1, Math.min(1, sign * Math.sin(ra*DEG) * Math.tan(eps) * Math.tan(latDeg*DEG)));
    const arc = Math.acos(x)/DEG;
    const next = quadrantFlip ? ramc + 180 - arc/F : ramc + arc/F;
    if(Math.abs(next-ra) < 1e-6){ ra = next; break; }
    ra = next;
  }
  return raToEclipticLon(ra, eps);
}
// oblique-ascension (birthplace-latitude) trisection — target is a linear
// split between OA(MC) and OA(ASC) (or ASC->IC), then solved for the
// ecliptic point whose OWN oblique ascension hits that target. OA = RA - AD;
// MC/ASC/IC's own OA still needs deriving from their actual RA and
// declination (NOT simply RAMC/RAMC+90/RAMC+180 — that seemed like a
// reasonable simplification but verified wrong for OA_MC specifically
// against Swiss Ephemeris; only OA_ASC happens to land close to RAMC+90).
function obliqueAscensionOf(lonDeg, raDeg, latDeg, eps){
  return raDeg - ascensionalDiff(latDeg, declOfEclipticLon(lonDeg, eps));
}
function solveKochCusp(targetOA, latDeg, eps){
  let ra = targetOA;
  for(let i=0;i<20;i++){
    const lon = raToEclipticLon(ra, eps);
    const decl = declOfEclipticLon(lon, eps);
    const next = targetOA + ascensionalDiff(latDeg, decl);
    if(Math.abs(next-ra) < 1e-6){ ra = next; break; }
    ra = next;
  }
  return raToEclipticLon(ra, eps);
}
// returns 12 cusp longitudes (index 0 = house 1 = Ascendant, index 9 = house
// 10 = MC, etc). angles is whatever computeAngles(...) returned.
function computeHouseCusps(system, angles, latDeg){
  const {asc, mc, ramc} = angles;
  const eps = OBLIQUITY_J2000;
  if(system==='whole'){
    const base = Math.floor(normDeg(asc)/30)*30;
    return Array.from({length:12}, (_,i)=>normDeg(base+i*30));
  }
  if(system==='equal'){
    return Array.from({length:12}, (_,i)=>normDeg(asc+i*30));
  }
  // placidus & koch share the four angle cusps (1/4/7/10); only 11/12/2/3
  // (and their opposite points, 5/6/8/9) differ by system
  let c11, c12, c2, c3;
  if(system==='koch'){
    const raAsc = eclipticLonToRA(asc, eps);
    const raIc = normDeg(ramc+180);
    const oaMc = obliqueAscensionOf(mc, ramc, latDeg, eps);
    const oaAsc = obliqueAscensionOf(asc, raAsc, latDeg, eps);
    const oaIc = obliqueAscensionOf(normDeg(mc+180), raIc, latDeg, eps);
    c11 = solveKochCusp(oaMc + (oaAsc-oaMc)/3, latDeg, eps);
    c12 = solveKochCusp(oaMc + 2*(oaAsc-oaMc)/3, latDeg, eps);
    c2  = solveKochCusp(oaAsc + (oaIc-oaAsc)/3, latDeg, eps);
    c3  = solveKochCusp(oaAsc + 2*(oaIc-oaAsc)/3, latDeg, eps);
  } else { // placidus is also the fallback for any unrecognized key
    c11 = solvePlacidusCusp(ramc+30, ramc, latDeg, eps, false, 3);
    c12 = solvePlacidusCusp(ramc+60, ramc, latDeg, eps, false, 1.5);
    c2  = solvePlacidusCusp(ramc+120, ramc, latDeg, eps, true, 1.5);
    c3  = solvePlacidusCusp(ramc+150, ramc, latDeg, eps, true, 3);
  }
  const cusps = new Array(12);
  cusps[0]=normDeg(asc); cusps[9]=normDeg(mc); cusps[3]=normDeg(mc+180); cusps[6]=normDeg(asc+180);
  cusps[10]=normDeg(c11); cusps[11]=normDeg(c12); cusps[1]=normDeg(c2); cusps[2]=normDeg(c3);
  cusps[4]=normDeg(c11+180); cusps[5]=normDeg(c12+180); cusps[7]=normDeg(c2+180); cusps[8]=normDeg(c3+180);
  return cusps;
}
// which house (1-12) an ecliptic longitude falls in, given a 12-cusp array
function houseOfElon(elon, cusps){
  const e = normDeg(elon);
  for(let i=0;i<12;i++){
    const start = cusps[i], end = cusps[(i+1)%12];
    const span = normDeg(end-start) || 360; // 0 means the two cusps coincide (degenerate at extreme latitudes) — treat as a full house rather than a zero-width one
    if(normDeg(e-start) < span) return i+1;
  }
  return 12; // unreachable in practice; keeps the function total
}
function natalUTCDate(n){
  const [y,m,d] = n.date.split('-').map(Number);
  const [hh,mm] = n.time.split(':').map(Number);
  const localMs = Date.UTC(y, m-1, d, hh, mm);
  return new Date(localMs - n.utcOffset*3600000);
}
function computeNatalState(n){
  const dateUTC = natalUTCDate(n);
  const state = computeState(dateUTC);
  const angles = computeAngles(dateUTC, n.lat, n.lon);
  [['asc','ASCENDANT','AC','#ffffff',angles.asc],['mc','MIDHEAVEN','MC','#ffe9b0',angles.mc]].forEach(([key,name,abbr,color,elon])=>{
    const sd = degToSign(elon);
    state.bodies[key] = {key,name,glyph:abbr,abbr,color,elon,elat:0,retro:false,sign:sd.sign,deg:sd.deg};
  });
  return state;
}
function computeTransitAspects(liveState, natalState){
  const tKeys = Object.keys(liveState.bodies).filter(k=>k!=='earth');
  const nKeys = Object.keys(natalState.bodies).filter(k=>k!=='earth');
  const out = [];
  tKeys.forEach(tk=>{
    nKeys.forEach(nk=>{
      const t = liveState.bodies[tk], n = natalState.bodies[nk];
      let diff = Math.abs(t.elon-n.elon)%360; if(diff>180) diff = 360-diff;
      let best=null, bestOrb=Infinity;
      ASPECTS.forEach(asp=>{ const orb=Math.abs(diff-asp.angle); if(orb<=asp.orb && orb<bestOrb){best=asp;bestOrb=orb;} });
      if(best) out.push({t,n,aspect:best,orb:bestOrb});
    });
  });
  out.sort((a,b)=>a.orb-b.orb);
  return out;
}

const PROFILES_KEY = 'ct12_profiles';

// people think of this ("I use Placidus"), not a property of any one chart
function getHouseSystem(){
  const v = localStorage.getItem(HOUSE_SYSTEM_KEY);
  return HOUSE_SYSTEMS.some(s=>s.key===v) ? v : 'placidus';
}
function setHouseSystem(key){ localStorage.setItem(HOUSE_SYSTEM_KEY, key); }
function cycleHouseSystem(){
  const i = HOUSE_SYSTEMS.findIndex(s=>s.key===getHouseSystem());
  setHouseSystem(HOUSE_SYSTEMS[(i+1)%HOUSE_SYSTEMS.length].key);
}
function getPrimaryProfile(){ const id=getPrimaryId(); return id ? loadProfiles().find(p=>p.id===id)||null : null; }
function upsertProfile(p){

}

}
const natalStateCache = new Map();
function getNatalState(p){
  const key = p.id+':'+p.date+':'+p.time+':'+p.utcOffset+':'+p.lat+':'+p.lon;
  if(!natalStateCache.has(key)) natalStateCache.set(key, computeNatalState(p));
  return natalStateCache.get(key);
}
// house cusps depend only on the profile's birth data + the chosen system —
// never on the live/scrubbed clock — so they're cached the same way natal
// state is, keyed by profile+system, and only recomputed when either changes
// (Placidus/Koch's iteration isn't free, and the natal wheel redraws every
// frame now, so this matters)
const houseCuspsCache = new Map();
// asc is cached alongside cusps (not re-derived from cusps[0]) because Whole
// Sign's house-1 cusp is the START OF THE SIGN, not the literal Ascendant
// degree — using cusps[0] as the wheel's rotation anchor there would pin the
// sign boundary to the left instead of the actual Ascendant, leaving the AC
// marker visibly adrift from the "1" label by however far into the sign the
// Ascendant actually falls.
function getHouseCuspsEntry(p){
  const system = getHouseSystem();
  const key = p.id+':'+p.date+':'+p.time+':'+p.utcOffset+':'+p.lat+':'+p.lon+':'+system;
  if(!houseCuspsCache.has(key)){
    const angles = computeAngles(natalUTCDate(p), p.lat, p.lon);
    houseCuspsCache.set(key, {cusps: computeHouseCusps(system, angles, p.lat), asc: angles.asc});
  }
  return houseCuspsCache.get(key);
}
function getHouseCusps(p){ return getHouseCuspsEntry(p).cusps; }
function getNatalAsc(p){ return getHouseCuspsEntry(p).asc; }

function moonPhaseLabel(state){

// ---------- date search (electional) ----------
// Every search here reduces to the same shape: a function of time that crosses
// zero at the moment you want (an aspect going exact, a station, a sign cusp).
// wrapSigned() folds any angle difference into (-180,180], so the crossing is a
// real sign flip even across the 0/360 seam — the one exception is the seam
// itself (e.g. two samples landing on either side of the antipodal point), which
// looks like a flip too; findZeroCrossings guards against that by requiring the
// jump between samples be small, since a genuine crossing near zero never jumps far.
function wrapSigned(deg){ return ((deg%360)+540)%360-180; }

// bodyPosition/earthHelioECLAt/dateToJD already exist for the live readout, which
// computes all 16 bodies every call — a search needs one body at a time, thousands
// of times, so this calls the same math directly instead of going through computeState.
function bodyElonAt(key, date){
  const def = BODY_DEFS.find(b=>b.key===key);
  const time = A.MakeTime(date);
  const jd = dateToJD(date);
  return bodyPosition(def, time, jd, earthHelioECLAt(time)).elon;
}

function findZeroCrossings(fn, from, to, stepDays, tolMinutes){
  const hits = [];
  let t0 = new Date(from), v0 = fn(t0);
  while(t0.getTime() < to.getTime()){
    const t1 = new Date(Math.min(to.getTime(), t0.getTime()+stepDays*86400000));
    const v1 = fn(t1);
    if(v0===0){
      hits.push(new Date(t0));
    } else if((v0<0)!==(v1<0) && Math.abs(v1-v0)<180){
      let lo=t0, hi=t1, vLo=v0;
      while(hi.getTime()-lo.getTime() > tolMinutes*60000){
        const mid = new Date((lo.getTime()+hi.getTime())/2);
        const vMid = fn(mid);
        if((vMid<0)===(vLo<0)){ lo=mid; vLo=vMid; } else { hi=mid; }
      }
      hits.push(new Date(Math.round((lo.getTime()+hi.getTime())/2)));
    }
    t0=t1; v0=v1;
  }
  return hits;
}

// aspects other than conjunction/opposition happen on either side (e.g. a square
// can be body A 90° ahead of B, or 90° behind) — both are searched and merged.
function searchAspectDates(keyA, keyB, aspectAngle, from, to, stepDays=1){
  const targets = (aspectAngle===0 || aspectAngle===180) ? [aspectAngle] : [aspectAngle,-aspectAngle];
  let hits = [];
  targets.forEach(target=>{
    const fn = (date)=> wrapSigned(wrapSigned(bodyElonAt(keyA,date)-bodyElonAt(keyB,date)) - target);
    hits = hits.concat(findZeroCrossings(fn, from, to, stepDays, 2));
  });
  hits.sort((a,b)=>a-b);
  return hits.map(date=>({date}));
}

// Multi-body shapes (grand trine, T-square, yod, grand cross) aren't a single
// exact instant like a 2-body aspect — 3+ moving bodies essentially never hit
// a perfect angle simultaneously, so these are found as an orb window instead:
// sort the bodies' longitudes, take the gaps between neighbors (wrapping around
// the circle), and compare that sorted gap list to the shape's target gaps —
// e.g. three bodies 120° apart all round (a triangle) is a grand trine no matter
// which body sits where, so sorting the gaps makes the check order-independent.
function gapError(elons, targetGaps){
  const sorted = [...elons].sort((a,b)=>a-b);
  const gaps = sorted.map((lon,i)=> i<sorted.length-1 ? sorted[i+1]-lon : 360-lon+sorted[0]);
  const gapsSorted = gaps.sort((a,b)=>a-b);
  let err = 0;
  for(let i=0;i<gapsSorted.length;i++) err += Math.abs(gapsSorted[i]-targetGaps[i]);
  return err;
}
function searchPatternDates(keys, targetGaps, orbDeg, from, to, stepDays=1){
  const maxErr = orbDeg * keys.length;
  const errAt = (date)=> gapError(keys.map(k=>bodyElonAt(k,date)), targetGaps);
  const hits = [];
  let windowStart = null;
  let t = new Date(from);
  while(t.getTime() <= to.getTime()){
    const within = errAt(t) <= maxErr;
    if(within && windowStart===null){ windowStart = new Date(t); }
    else if(!within && windowStart!==null){ hits.push(refinePatternPeak(errAt, windowStart, t)); windowStart=null; }
    t = new Date(t.getTime()+stepDays*86400000);
  }
  if(windowStart!==null) hits.push(refinePatternPeak(errAt, windowStart, to));
  return hits;
}
// once a qualifying window is found at day resolution, re-sample it (bounded to a
// fixed number of steps regardless of how long the window runs) to pin down the
// tightest — lowest-error — moment within it
function refinePatternPeak(errAt, start, end){
  const span = end.getTime()-start.getTime();
  const stepMs = Math.max(3600000, span/48);
  let best = {date:new Date(start), err:errAt(start)};
  for(let ms=start.getTime()+stepMs; ms<=end.getTime(); ms+=stepMs){
    const d = new Date(ms);
    const e = errAt(d);
    if(e < best.err) best = {date:d, err:e};
  }
  return best;
}

function searchStationDates(key, from, to, stepDays=1){
  const dt = 0.2; // days, finite-difference window for instantaneous speed
  const fn = (date)=> wrapSigned(bodyElonAt(key,date) - bodyElonAt(key,new Date(date.getTime()-dt*86400000)));
  return findZeroCrossings(fn, from, to, stepDays, 2).map(date=>{
    const before = bodyElonAt(key, new Date(date.getTime()-3600000));
    const after = bodyElonAt(key, new Date(date.getTime()+3600000));
    return {date, turningRetro: wrapSigned(after-before)<0};
  });
}

function searchIngressDates(key, from, to, stepDays=1){
  let hits = [];
  for(let sign=0; sign<12; sign++){
    const boundary = sign*30;
    const fn = (date)=> wrapSigned(bodyElonAt(key,date) - boundary);
    findZeroCrossings(fn, from, to, stepDays, 2).forEach(date=>hits.push({date, sign}));
  }
  hits.sort((a,b)=>a.date-b.date);
  return hits;
}

let liveMode = true;

function easeInOutQuad(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
// Sampling the real ephemeris at an in-between moment (rather than lerping
// cartesian x/y/z) means every body visibly travels along its own true
// curved orbit during the transition, not a straight cut through space.
function interpState(from,to,tRaw){
  const t = easeInOutQuad(tRaw);
  const interpDate = new Date(from.date.getTime() + (to.date.getTime()-from.date.getTime())*t);
  const time = A.MakeTime(interpDate);
  const jd = dateToJD(interpDate);
  const earthHelioECL = earthHelioECLAt(time);
  const bodies = {};
  BODY_DEFS.forEach(b=>{
    const pos = bodyPosition(b, time, jd, earthHelioECL);
    const sd = pos.elon==null ? null : degToSign(pos.elon);
    bodies[b.key] = {
      key:b.key, name:b.name, glyph:b.glyph, abbr:b.abbr, color:b.color,
      elon:pos.elon, elat:pos.elat, helioECL:pos.helioECL,
      retro: t<0.5 ? from.bodies[b.key].retro : to.bodies[b.key].retro,
      sign: sd?sd.sign:null, deg: sd?sd.deg:null,
    };
  });
  return {date:interpDate, jd, bodies, earthHelioECL};
}

function goToDate(d, animate){

// ================= 3D orbit view (always-on galaxy backdrop) =================
const ctx3 = els.canvas3d.getContext('2d');
const cam = {yaw:0.6, pitch:0.5, autorotate:true, zoom:1};
let dragging=false, lastX=0, lastY=0;
const activePointers = new Map();
let pinchStartDist=0, pinchStartZoom=1;
// each body's last-drawn screen position (CSS px) + its pre-rotation 3D scene
// position, refreshed every render3d frame — lets a tap be hit-tested against
// whatever's actually on screen right now, and lets the camera re-aim at
// whichever body was tapped instead of always orbiting around the sun
let lastBodyPositions = {};
function pointerDist(){
  const pts=[...activePointers.values()];
  if(pts.length<2) return 0;
  return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
}
// rotate-drag + pinch/wheel zoom, shared by both the orbit view and the chart wheel
// (which reads the same cam.zoom so the two stay in sync when layered together)
function attachGalaxyControls(canvas, {allowDrag, onTap}){
  let tapStart = null;
  canvas.addEventListener('pointerdown', e=>{
    camZoomTween = null; // don't fight an in-flight focus/close animation with manual input
    activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    tapStart = activePointers.size===1 ? {x:e.clientX, y:e.clientY, id:e.pointerId} : null;
    if(activePointers.size===1 && allowDrag){
      dragging=true; cam.autorotate=false; lastX=e.clientX; lastY=e.clientY;
      els.canvas3d.classList.add('dragging');
    } else {
      dragging=false; pinchStartDist=pointerDist(); pinchStartZoom=cam.zoom;
    }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if(tapStart && e.pointerId===tapStart.id && Math.hypot(e.clientX-tapStart.x, e.clientY-tapStart.y)>6) tapStart=null;
    if(activePointers.size>=2){
      const d = pointerDist();
      if(pinchStartDist>0) cam.zoom = Math.min(4, Math.max(0.3, pinchStartZoom*(d/pinchStartDist)));
      return;
    }
    if(!dragging || !allowDrag) return;
    cam.yaw += (e.clientX-lastX)*0.006;
    cam.pitch += (e.clientY-lastY)*0.006;
    cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch));
    lastX=e.clientX; lastY=e.clientY;
  });
  function endPointer(e, cancelled){
    if(!cancelled && onTap && tapStart && e.pointerId===tapStart.id){
      const rect = canvas.getBoundingClientRect();
      onTap(e.clientX-rect.left, e.clientY-rect.top);
    }
    tapStart = null;
    activePointers.delete(e.pointerId);
    if(activePointers.size<2){ pinchStartDist=0; }
    if(activePointers.size===0){ dragging=false; els.canvas3d.classList.remove('dragging'); }
  }
  canvas.addEventListener('pointerup', e=>endPointer(e,false));
  canvas.addEventListener('pointercancel', e=>endPointer(e,true));
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    camZoomTween = null;
    cam.zoom = Math.min(4, Math.max(0.3, cam.zoom*(1 - e.deltaY*0.0016)));
  }, {passive:false});
}
function findTappedBody(x, y){
  // among every body within reach of the tap, prefer the SMALLEST one, not the
  // closest — the Sun sits dead center and inner planets (Mercury/Venus/Mars)
  // render close beside it, so a tap aimed at one of them was often literally
  // nearer to the Sun's own center, and "closest wins" kept resolving to the
  // Sun no matter which small planet was actually being tapped
  let best=null, bestSize=Infinity;
  for(const key in lastBodyPositions){
    const p = lastBodyPositions[key];
    const d = Math.hypot(x-p.sx, y-p.sy);
    const hitR = 28; // flat, generous touch target — visual size shouldn't dictate tap size
    if(d<=hitR && p.size<bestSize){ best=key; bestSize=p.size; }
  }
  return best;
}
// shared by canvas3d's own tap handler and the readout list's tap-through
// (see attachReadoutTapThrough) so a tap lands on the same body/focus logic
// regardless of which element actually received the pointer events
function handleOrbitTap(x,y){
  if(activeView!=='orbit') return;
  // any tap while already focused closes it, full stop — the focused body
  // (the sun especially, now that it's been zoomed up to 3x its size) can
  // fill most of the screen, so trying to tell "tapped empty space" apart
  // from "tapped the huge sun by accident" was exactly why it kept
  // re-focusing the sun no matter what you were actually aiming for
  if(focusedBodyKey){ closeFocus(); return; }
  const key = findTappedBody(x,y);
  if(key) focusOnBody(key);
}
attachGalaxyControls(els.canvas3d, {allowDrag:true, onTap:handleOrbitTap});
// the readout list sits on top of canvas3d and needs full pointer-events for
// native scrolling to work everywhere in it (not just the gaps between rows
// — see the CSS comment on .readout for why that used to be split). A tap
// that isn't part of a scroll drag is forwarded to the exact same hit-test
// canvas3d's own taps use, so the Sun (which renders at screen center and
// can end up under this left-docked list) stays tappable through it.
(function attachReadoutTapThrough(){
  let tapStart = null;
  els.readout.addEventListener('pointerdown', e=>{ tapStart = {x:e.clientX, y:e.clientY, id:e.pointerId}; });
  els.readout.addEventListener('pointermove', e=>{
    if(tapStart && e.pointerId===tapStart.id && Math.hypot(e.clientX-tapStart.x, e.clientY-tapStart.y)>6) tapStart=null;
  });
  function endTap(e){
    if(tapStart && e.pointerId===tapStart.id){
      const rect = els.canvas3d.getBoundingClientRect();
      handleOrbitTap(e.clientX-rect.left, e.clientY-rect.top);
    }
    tapStart = null;
  }
  els.readout.addEventListener('pointerup', endTap);
  els.readout.addEventListener('pointercancel', ()=>{ tapStart=null; });
})();
// the chart wheel used to share the galaxy's pinch/wheel zoom with no panning,
// which just magnifies the empty donut hole in the middle — give it its own
// zoom+pan (same as the natal/overlay wheels) so you can actually get in close
// on a crowded cluster of glyphs instead of the whole ring scaling in place
const chartZoom = {z:1, ox:0, oy:0};
attachWheelZoom(els.canvasChart, chartZoom, ()=>{});

function fitCanvas(canvas){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  canvas.width = Math.max(1,Math.round(r.width*dpr));
  canvas.height = Math.max(1,Math.round(r.height*dpr));
  return dpr;
}
// pan.x/pan.y shift the WHOLE projected scene by a fixed screen-space amount.
// This is the only way to put a body other than the sun at screen center: the
// camera rotates the world around the origin, and the sun sits exactly at
// that origin, so the sun projects to (cx,cy) for literally every yaw/pitch —
// rotating to "center" a different planet just brings that planet onto the
// same viewing ray as the sun, so they both land on the same pixel and zoom
// still expands outward from that one shared point. A real pan is required to
// move the anchor away from the sun; see render3d for how it's computed.
function project3d(p, cx, cy, dpr, pan){
  const cosY=Math.cos(cam.yaw), sinY=Math.sin(cam.yaw);
  const x1 = p.x*cosY - p.y*sinY;
  const y1 = p.x*sinY + p.y*cosY;
  const z1 = p.z;
  const cosP=Math.cos(cam.pitch), sinP=Math.sin(cam.pitch);
  const y2 = y1*cosP - z1*sinP;
  const z2 = y1*sinP + z1*cosP;
  const focal = 5.2;
  const persp = focal/(focal+z2);
  const scale = 30*dpr*cam.zoom;
  const px = pan?pan.x:0, py = pan?pan.y:0;
  return {sx:cx + x1*scale*persp - px, sy:cy - y2*scale*persp - py, depth:z2, persp};
}
function displayRadius(realDist){ return Math.sqrt(Math.max(0.05,realDist))*2.1; }
function drawOrbitRing(a, e, cx, cy, dpr, color, pan){
  ctx3.beginPath();
  const N=90;
  for(let i=0;i<=N;i++){
    const th = i/N*2*Math.PI;
    const r = a*(1-e*e)/(1+e*Math.cos(th)); // true distance along ellipse (perihelion at th=0, unrotated — decorative only)
    const dr = displayRadius(r);
    const p = project3d({x:dr*Math.cos(th), y:dr*Math.sin(th), z:0}, cx, cy, dpr, pan);
    if(i===0) ctx3.moveTo(p.sx,p.sy); else ctx3.lineTo(p.sx,p.sy);
  }
  ctx3.strokeStyle = color; ctx3.lineWidth = 1*dpr; ctx3.globalAlpha = 0.35; ctx3.stroke(); ctx3.globalAlpha = 1;
}
function render3d(state){
  const dpr = fitCanvas(els.canvas3d);
  const w = els.canvas3d.width, h = els.canvas3d.height;
  ctx3.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;

  // pan the whole projected scene so the focused body's OWN natural position —
  // not the sun's fixed center — is what ends up at screen center (see the
  // comment on project3d for why rotation alone can never do this). Reuses
  // last frame's stored p3 for the target, which is fine since orbital motion
  // is negligible frame-to-frame and autorotate is off while focused anyway.
  let pan = {x:0, y:0};
  if(focusedBodyKey){
    const prev = lastBodyPositions[focusedBodyKey];
    if(prev && prev.p3){
      const raw = project3d(prev.p3, cx, cy, dpr);
      pan = {x: (raw.sx-cx)*panFade, y: (raw.sy-cy)*panFade};
    }
  }

  // faint unnamed field stars, fixed to the screen (cheap depth cue, doesn't rotate)
  ctx3.fillStyle = 'rgba(255,255,255,.5)';
  for(let i=0;i<70;i++){
    const sx=(i*97 % w), sy=(i*53 % h);
    ctx3.globalAlpha = 0.15+((i*31)%50)/100;
    ctx3.fillRect(sx,sy,1,1);
  }
  ctx3.globalAlpha=1;

  // real constellations, rotating with the camera like a fixed backdrop sphere —
  // orthographic (no perspective/zoom) since they're conceptually at infinity
  // (disabled for now — read as visual noise; revisit the look before re-enabling)
  const SHOW_CONSTELLATIONS = false;
  const skyR = Math.min(w,h)*0.48;
  const cosY=Math.cos(cam.yaw), sinY=Math.sin(cam.yaw), cosP=Math.cos(cam.pitch), sinP=Math.sin(cam.pitch);
  function projectStar(v){
    const x1 = v.x*cosY - v.y*sinY, y1 = v.x*sinY + v.y*cosY, z1 = v.z;
    const y2 = y1*cosP - z1*sinP, z2 = y1*sinP + z1*cosP;
    return {sx:cx+x1*skyR, sy:cy-y2*skyR, front:z2<=0};
  }
  ctx3.strokeStyle = 'rgba(255,255,255,.18)'; ctx3.lineWidth = 1*dpr;
  if(SHOW_CONSTELLATIONS) Object.values(CONSTELLATIONS).forEach(c=>{
    const pts = c.vecs.map(projectStar);
    c.lines.forEach(([i,j])=>{
      if(!pts[i].front || !pts[j].front) return;
      ctx3.beginPath(); ctx3.moveTo(pts[i].sx,pts[i].sy); ctx3.lineTo(pts[j].sx,pts[j].sy); ctx3.stroke();
    });
    pts.forEach(p=>{
      if(!p.front) return;
      ctx3.fillStyle = 'rgba(255,255,255,.85)'; ctx3.shadowColor='#fff'; ctx3.shadowBlur=3*dpr;
      ctx3.beginPath(); ctx3.arc(p.sx,p.sy,1.4*dpr,0,7); ctx3.fill();
      ctx3.shadowBlur=0;
    });
  });

  // orbit rings (decorative, uses catalog a/e — not the animated body position)
  BODY_DEFS.forEach(b=>{
    if(b.type==='moon' || b.type==='node') return;
    drawOrbitRing(b.orbitA, b.orbitE||0, cx, cy, dpr, 'rgba(125,211,255,.5)', pan);
  });

  // sun — deliberately oversized against every other body, like the real thing.
  // ONLY the specifically-focused body gets the zoom-in size boost — earlier
  // this scaled every body up together, so the sun (already the biggest thing
  // in the scene) stayed just as dominant no matter which planet you'd
  // actually tapped, which is exactly why it kept "looking like" it always
  // zoomed to the sun even once the correct body was being focused
  const sunSizeMul = focusedBodyKey==='sun' ? Math.min(3,cam.zoom)*2.2 : 1;
  const sunP = project3d({x:0,y:0,z:0}, cx, cy, dpr, pan);
  const grad = ctx3.createRadialGradient(sunP.sx,sunP.sy,0,sunP.sx,sunP.sy,30*dpr*sunSizeMul);
  grad.addColorStop(0,'rgba(255,176,0,.9)'); grad.addColorStop(1,'rgba(255,176,0,0)');
  ctx3.fillStyle=grad; ctx3.beginPath(); ctx3.arc(sunP.sx,sunP.sy,30*dpr*sunSizeMul,0,7); ctx3.fill();
  ctx3.fillStyle='#ffe9b0'; ctx3.beginPath(); ctx3.arc(sunP.sx,sunP.sy,9*dpr*sunSizeMul,0,7); ctx3.fill();
  lastBodyPositions.sun = {sx:sunP.sx/dpr, sy:sunP.sy/dpr, size:9*sunSizeMul, p3:{x:0,y:0,z:0}};

  // bodies, sorted back-to-front — nodes aren't physical bodies with a real
  // position in space (see bodyPosition's 'node' branch), so they don't
  // belong in this 3D scene at all, only in the 2D wheels
  const drawList = BODY_DEFS.filter(b=>b.type!=='moon' && b.type!=='node').map(b=>{
    const s = state.bodies[b.key];
    const real = s.helioECL;
    const dist = Math.hypot(real.x,real.y,real.z);
    const dr = displayRadius(dist);
    const scaleF = dist>1e-6 ? dr/dist : 0;
    const p3 = {x:real.x*scaleF, y:real.y*scaleF, z:real.z*scaleF};
    const proj = project3d(p3, cx, cy, dpr, pan);
    return {b, s, proj, p3};
  });

  // Moon — offset from Earth's exaggerated position in its true geocentric direction,
  // pushed out to a visible (not-to-scale) distance so it doesn't sit inside Earth's dot
  const earthReal = state.bodies.earth.helioECL;
  const earthDist = Math.hypot(earthReal.x,earthReal.y,earthReal.z);
  const earthScale = displayRadius(earthDist)/earthDist;
  const earthP3 = {x:earthReal.x*earthScale, y:earthReal.y*earthScale, z:earthReal.z*earthScale};
  const moonS = state.bodies.moon;
  const mdir = {
    x: Math.cos(moonS.elat*DEG)*Math.cos(moonS.elon*DEG),
    y: Math.cos(moonS.elat*DEG)*Math.sin(moonS.elon*DEG),
    z: Math.sin(moonS.elat*DEG),
  };
  const MOON_OFFSET = 0.4;
  const moonP3 = {x:earthP3.x+mdir.x*MOON_OFFSET, y:earthP3.y+mdir.y*MOON_OFFSET, z:earthP3.z+mdir.z*MOON_OFFSET};
  drawList.push({b:{key:'moon', glyph:'☽︎', color:'#d8d8e6'}, s:moonS, proj:project3d(moonP3, cx, cy, dpr, pan), p3:moonP3});

  drawList.sort((a,b)=>a.proj.depth-b.proj.depth);

  const moonPhaseFrac = (((moonS.elon-state.bodies.sun.elon)%360)+360)%360/360;
  const backdrop = activeView==='chart'; // dimmed, static, decluttered when it's just a backdrop
  drawList.forEach(({b,s,proj,p3})=>{
    const sizeMul = b.key===focusedBodyKey ? Math.min(3,cam.zoom)*2.2 : 1;
    const size = bodyDotPx(b.key, 2.2, 6.5)*dpr*Math.max(0.5,proj.persp)*sizeMul;
    // soft glow halo first (flat + shadowBlur), then the detailed sphere drawn
    // crisply on top — combining glow and detail in one pass would blur the detail
    ctx3.save();
    ctx3.fillStyle = b.color;
    ctx3.shadowColor = b.color; ctx3.shadowBlur = 8*dpr;
    ctx3.beginPath(); ctx3.arc(proj.sx,proj.sy,size,0,7); ctx3.fill();
    ctx3.restore();
    drawBodyIcon(ctx3, proj.sx, proj.sy, size, b.key, b.color, b.key==='moon'?{phaseFrac:moonPhaseFrac}:undefined);
    if(!backdrop && b.key===focusedBodyKey) drawMoons(ctx3, b.key, proj.sx, proj.sy, size, dpr);
    if(!backdrop){
      ctx3.font = (19*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace";
      ctx3.fillStyle = 'rgba(255,255,255,.85)';
      ctx3.fillText(b.glyph, proj.sx+size+4*dpr, proj.sy+5*dpr);
    }
    if(!backdrop) lastBodyPositions[b.key] = {sx:proj.sx/dpr, sy:proj.sy/dpr, size:size/dpr, p3};
  });

  if(backdrop){
    // reads as ambient texture behind the chart wheel, not a competing focal layer
    ctx3.fillStyle = 'rgba(6,5,12,.55)';
    ctx3.fillRect(0,0,w,h);
  } else if(cam.autorotate && !dragging){
    cam.yaw += 0.0016;
  }
}

function renderReadout(state){
  const aspects = computeAspects(state);
  let html = '<div class="hd">PLACEMENTS</div>';
  Object.values(state.bodies).forEach(s=>{
    if(s.elon==null) return;
    const z = ZODIAC[s.sign];
    html += `<div class="row"><span class="g">${s.glyph}</span><span class="nm">${s.abbr}</span><span class="pos">${z.glyph} ${fmtDeg(s.deg)}</span><span class="r">${s.retro?'℞︎':''}</span></div>`;
  });
  html += '<div class="hd">ASPECTS</div>';
  if(aspects.length===0) html += '<div class="row">— none within orb —</div>';
  aspects.slice(0,16).forEach(as=>{
    html += `<div class="arow"><span class="g">${as.a.glyph}</span><span class="g">${as.aspect.glyph}</span><span class="g">${as.b.glyph}</span><b>${as.aspect.abbr}</b><span class="orb">orb ${fmtDeg(as.orb)}</span></div>`;
  });

}

// ================= chart wheel (cast) =================
// reusable zodiac-wheel renderer — used by CAST CHART and by the natal profile view
// shared base for every zodiac wheel: wedges, divider ring, degree ticks, sign glyphs.
// Returns {signBandR, ringR} so callers know where the planet-plotting area starts.
// textAlign='center' measures the whole string including the invisible U+FE0E
// text-presentation selector appended to every glyph (see the mobile-emoji fix)
// — not every engine treats that as zero-width for metrics purposes, which
// throws centering off by a few px in a way that's only visible on some
// browsers. Measuring just the visible base glyph and placing it by hand
// sidesteps whatever a given engine does with the invisible tail.
function fillGlyphCentered(ctxC, text, x, y){
  const baseWidth = ctxC.measureText(text.replace(/︎/g,'')).width;
  const prevAlign = ctxC.textAlign;
  ctxC.textAlign = 'left';
  ctxC.fillText(text, x-baseWidth/2, y);
  ctxC.textAlign = prevAlign;
}
// whole-sign houses: house 1 is whichever sign the Ascendant falls in (or Aries,
// for the plain current-sky cast chart, which has no location/Ascendant at all),
// and each following sign is the next house in order — no Placidus-style cusp
// math needed, so it works the same for a natal chart or a location-less one
function drawWheelBase(ctxC, cx, cy, R, dpr, ascElon, houseCusps){
  // when real houseCusps exist (the natal wheel), rotate the whole wheel so
  // the Ascendant always sits at the LEFT (9 o'clock) — the standard chart
  // convention — instead of wherever its raw ecliptic longitude happens to
  // fall. Cast chart and compare (no houseCusps) keep the original fixed-
  // zodiac orientation unchanged, since neither has one real Ascendant to
  // anchor to. Rotates on the literal Ascendant (ascElon), NOT houseCusps[0]
  // — those only coincide for Placidus/Equal/Koch; Whole Sign's house-1
  // cusp is the START OF THE SIGN, so anchoring on it there would pin the
  // sign boundary to the left while the real AC marker drifts away from it.
  const ascRotation = houseCusps ? ascElon : null;
  function angFor(elon){
    if(ascRotation==null) return -elon*DEG;
    return -(elon-ascRotation)*DEG + Math.PI;
  }
  for(let i=0;i<12;i++){
    const a0=angFor(i*30), a1=angFor((i+1)*30);
    ctxC.beginPath(); ctxC.moveTo(cx,cy); ctxC.arc(cx,cy,R,a1,a0); ctxC.closePath();
    ctxC.fillStyle = i%2===0?'rgba(18,22,46,.92)':'rgba(38,26,62,.8)'; ctxC.fill();
  }
  ctxC.strokeStyle='rgba(125,211,255,.45)'; ctxC.lineWidth=1*dpr;
  ctxC.beginPath(); ctxC.arc(cx,cy,R,0,7); ctxC.stroke();

  const signBandR = R*0.82;
  const ringR = R*0.58;

  // a solid backdrop band between the sign ring and the anchor ring, reserved
  // entirely for planet glyphs — nothing else (wedge texture, tick marks) is
  // allowed to show through it, so labels never have to fight a pattern
  // underneath to stay legible
  ctxC.fillStyle = 'rgba(8,9,20,.96)';
  ctxC.beginPath(); ctxC.arc(cx,cy,signBandR,0,7);
  ctxC.arc(cx,cy,ringR,0,7,true);
  ctxC.fill('evenodd');

  ctxC.strokeStyle='rgba(125,211,255,.3)'; ctxC.lineWidth=1*dpr;
  ctxC.beginPath(); ctxC.arc(cx,cy,signBandR,0,7); ctxC.stroke();
  ctxC.beginPath(); ctxC.arc(cx,cy,ringR,0,7); ctxC.stroke();

  // degree tick marks only (no numbers) — exact degrees are already shown per
  // planet, so a second/third generic numeric scale was pure duplication
  ctxC.textAlign='center'; ctxC.textBaseline='middle';
  for(let d=0; d<360; d+=5){
    const a = angFor(d);
    const len = d%30===0 ? 9*dpr : 5*dpr;
    ctxC.strokeStyle='rgba(125,211,255,.4)'; ctxC.lineWidth=1*dpr;
    ctxC.beginPath();
    ctxC.moveTo(cx+Math.cos(a)*signBandR, cy+Math.sin(a)*signBandR);
    ctxC.lineTo(cx+Math.cos(a)*(signBandR-len), cy+Math.sin(a)*(signBandR-len));
    ctxC.stroke();
  }

  ctxC.font=(20*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace"; ctxC.fillStyle='#7dd3ff';
  const signGlyphR = (signBandR+R)/2;
  ZODIAC.forEach((z,i)=>{
    const a=angFor(i*30+15);
    fillGlyphCentered(ctxC, z.glyph, cx+Math.cos(a)*signGlyphR, cy+Math.sin(a)*signGlyphR);
  });

  // house numbers, in the open middle of the wheel. When a real houseCusps
  // array is given (single-profile natal wheel), draw variable-width wedge
  // boundaries + numbers matching whichever system is selected. Otherwise
  // (cast chart, compare — neither has a meaningful Ascendant to build real
  // houses from) fall back to the original fixed 30°-per-house behavior,
  // unchanged.
  const houseR = ringR*0.42;
  ctxC.font=(8.5*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace";
  ctxC.fillStyle='rgba(180,144,255,.6)';
  if(houseCusps){
    ctxC.strokeStyle='rgba(180,144,255,.35)'; ctxC.lineWidth=1*dpr;
    for(let i=0;i<12;i++){
      const start = houseCusps[i], end = houseCusps[(i+1)%12];
      const span = normDeg(end-start) || 360;
      const mid = normDeg(start + span/2);
      const aMid = angFor(mid);
      ctxC.fillText(String(i+1), cx+Math.cos(aMid)*houseR, cy+Math.sin(aMid)*houseR);
      const aStart = angFor(start);
      ctxC.beginPath();
      ctxC.moveTo(cx+Math.cos(aStart)*houseR*0.5, cy+Math.sin(aStart)*houseR*0.5);
      ctxC.lineTo(cx+Math.cos(aStart)*ringR, cy+Math.sin(aStart)*ringR);
      ctxC.stroke();
    }
  } else {
    const houseStartSign = ascElon!=null ? Math.floor((((ascElon%360)+360)%360)/30) : 0;
    for(let i=0;i<12;i++){
      const houseNum = ((i-houseStartSign+12)%12)+1;
      const a = angFor(i*30+15);
      ctxC.fillText(String(houseNum), cx+Math.cos(a)*houseR, cy+Math.sin(a)*houseR);
    }
  }

  return {signBandR, ringR};
}

function renderWheel(canvas, state, aspects, zoom, pan, rScale, houseCusps, natalAsc){
  const ctxC = canvas.getContext('2d');
  const dpr = fitCanvas(canvas);
  const w = canvas.width, h = canvas.height;
  ctxC.clearRect(0,0,w,h);
  // pan.ox/oy are tracked in CSS pixels (pointer events report client coords), but
  // w/h here are device/bitmap pixels — without the dpr scale, dragging barely
  // moves anything on a high-DPR phone since the offset is 2-3x too small
  const cx=w/2+(pan?pan.ox*dpr:0), cy=h/2+(pan?pan.oy*dpr:0);
  const R = Math.min(w,h)*(rScale||0.48)*(zoom||1);
  // must match drawWheelBase's own angFor exactly (same rotation anchor) or
  // the planet dots/aspect lines drawn here desync from the wedges/houses
  // drawn there. Rotates on the literal Ascendant (natalAsc), not
  // houseCusps[0] — see the comment on drawWheelBase for why those differ
  // under Whole Sign specifically.
  const ascRotation = houseCusps ? natalAsc : null;
  function angFor(elon){
    if(ascRotation==null) return -elon*DEG;
    return -(elon-ascRotation)*DEG + Math.PI;
  }
  const {ringR} = drawWheelBase(ctxC, cx, cy, R, dpr, ascRotation, houseCusps);

  // anchor = true position on the ring (where aspect lines attach, for accuracy);
  // label = anchor pushed outward in clustered steps so crowded glyphs don't overlap
  const bodyList = Object.values(state.bodies).filter(s=>s.elon!=null).sort((a,b)=>a.elon-b.elon);
  const CLUSTER_DEG = 7;
  let clusterStep = 0;
  bodyList.forEach((s,i)=>{
    const prev = bodyList[i-1];
    const close = prev && (Math.min(Math.abs(s.elon-prev.elon), 360-Math.abs(s.elon-prev.elon)) < CLUSTER_DEG);
    clusterStep = close ? clusterStep+1 : 0;
    s._labelStep = clusterStep;
  });
  // glyph and degree-text sit further out along the SAME radial line as the dot
  // (not a fixed up/down pixel nudge) — a fixed vertical offset looks fine for
  // bodies near the top of the wheel but drifts back toward the dot for bodies
  // near the bottom, since "outward" there is downward, working against it
  const anchors = {}, labels = {};
  bodyList.forEach(s=>{
    const a = angFor(s.elon);
    const cosA = Math.cos(a), sinA = Math.sin(a);
    anchors[s.key] = {x:cx+cosA*ringR*0.9, y:cy+sinA*ringR*0.9};
    const glyphR = ringR*0.9 + 26*dpr + s._labelStep*26*dpr;
    const degR = glyphR + 15*dpr;
    labels[s.key] = {x:cx+cosA*glyphR, y:cy+sinA*glyphR, dx:cx+cosA*degR, dy:cy+sinA*degR};
  });
  aspects.forEach(as=>{
    const p1=anchors[as.a.key], p2=anchors[as.b.key];
    if(!p1||!p2) return;
    ctxC.strokeStyle = as.aspect.color; ctxC.globalAlpha=0.6; ctxC.lineWidth=1.4*dpr;
    ctxC.setLineDash((as.aspect.dash||[]).map(d=>d*dpr));
    ctxC.beginPath(); ctxC.moveTo(p1.x,p1.y); ctxC.lineTo(p2.x,p2.y); ctxC.stroke();
    ctxC.setLineDash([]); ctxC.globalAlpha=1;
  });
  const moonPhaseFracW = state.bodies.sun ? (((state.bodies.moon.elon-state.bodies.sun.elon)%360)+360)%360/360 : null;
  bodyList.forEach(s=>{
    const p = anchors[s.key], lp = labels[s.key];
    const dotR = (bodyDotPx(s.key,2.5,5)||6)*dpr;
    ctxC.save();
    ctxC.fillStyle=s.color; ctxC.shadowColor=s.color; ctxC.shadowBlur=8*dpr;
    ctxC.beginPath(); ctxC.arc(p.x,p.y,dotR,0,7); ctxC.fill();
    ctxC.restore();
    drawBodyIcon(ctxC, p.x, p.y, dotR, s.key, s.color, s.key==='moon'?{phaseFrac:moonPhaseFracW}:undefined);
    if(s._labelStep>0){
      ctxC.strokeStyle='rgba(255,255,255,.25)'; ctxC.lineWidth=1*dpr;
      ctxC.beginPath(); ctxC.moveTo(p.x,p.y); ctxC.lineTo(lp.x,lp.y); ctxC.stroke();
    }
    // no per-glyph patch needed — drawWheelBase already laid down a solid
    // channel between the anchor ring and the sign ring for labels to sit in
    ctxC.font=(23*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace"; ctxC.fillStyle='#fff';
    fillGlyphCentered(ctxC, s.glyph, lp.x, lp.y);
    ctxC.font=(11*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace"; ctxC.fillStyle=s.color;
    ctxC.fillText(Math.round(s.deg)+'°', lp.dx, lp.dy);
  });
}

const OVERLAY_COLORS = ['#7dd3ff','#ff6b9d','#ffd166','#9fe680','#c792ea','#ff9f6b'];
// layers 2+ natal charts on one wheel — every person's placements colored by person
// (not by planet) so you can tell whose points are whose at a glance
// generic wheel zoom: wheel/trackpad + touch pinch, independent per canvas
// zoom (wheel/pinch) + single-finger drag-to-pan — panning matters here because these
// wheels are a donut of content around a blank center, so zooming alone just magnifies
// the empty middle; the user needs to be able to recenter on the ring after zooming in
// zoom used to range all the way from 0.4x to 4x — 4x pushed the ring itself
// past the canvas edges (nothing left onscreen but a few crossing aspect
// lines, no zodiac ring or glyphs to get your bearings from) and 0.4x shrank
// the whole wheel into a small unreadable clump with tons of dead canvas
// around it. Neither extreme was ever useful, so the range is narrowed to
// stay inside what's actually legible.
const WHEEL_ZOOM_MIN = 0.8, WHEEL_ZOOM_MAX = 1.6;
function attachWheelZoom(canvas, zoomState, onZoom){
  zoomState.ox = zoomState.ox||0; zoomState.oy = zoomState.oy||0;
  let pinchStart=0, pinchStartZoom=1, panning=false, lastX=0, lastY=0;
  const pointers = new Map();
  function dist(){ const pts=[...pointers.values()]; if(pts.length<2) return 0; return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y); }
  canvas.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){ pinchStart=dist(); pinchStartZoom=zoomState.z; panning=false; }
    else { panning=true; lastX=e.clientX; lastY=e.clientY; }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size>=2){
      const d=dist();
      if(pinchStart>0){ zoomState.z=Math.min(WHEEL_ZOOM_MAX,Math.max(WHEEL_ZOOM_MIN,pinchStartZoom*(d/pinchStart))); onZoom(); }
      return;
    }
    if(panning){
      // scale the pan range with zoom — zoomed-in content sits proportionally
      // further from center, so the reachable pan distance needs to grow too or
      // there's no way to drag zoomed-in edges (like the top of the wheel) into view
      const bound = Math.max(canvas.clientWidth, canvas.clientHeight)*0.6*zoomState.z;
      zoomState.ox = Math.min(bound, Math.max(-bound, zoomState.ox + (e.clientX-lastX)));
      zoomState.oy = Math.min(bound, Math.max(-bound, zoomState.oy + (e.clientY-lastY)));
      lastX=e.clientX; lastY=e.clientY;
      onZoom();
    }
  });
  function endP(e){ pointers.delete(e.pointerId); if(pointers.size<2) pinchStart=0; if(pointers.size===0) panning=false; }
  canvas.addEventListener('pointerup', endP);
  canvas.addEventListener('pointercancel', endP);
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    zoomState.z = Math.min(WHEEL_ZOOM_MAX, Math.max(WHEEL_ZOOM_MIN, zoomState.z*(1-e.deltaY*0.0016)));
    onZoom();
  }, {passive:false});
  canvas.addEventListener('dblclick', ()=>{ zoomState.z=1; zoomState.ox=0; zoomState.oy=0; onZoom(); });
}

// each visible person gets their own concentric ring (outermost = first pick,
// working inward) instead of everyone's dots sharing one ring — with 3-4
// charts overlaid, one shared ring made it impossible to tell whose Mars was
// whose even with color coding, since dots from different people at similar
// degrees landed almost on top of each other
function renderOverlayWheel(canvas, entries, activeMap, zoom, pan){
  const ctxC = canvas.getContext('2d');
  const dpr = fitCanvas(canvas);
  const w = canvas.width, h = canvas.height;
  ctxC.clearRect(0,0,w,h);
  const cx=w/2+(pan?pan.ox*dpr:0), cy=h/2+(pan?pan.oy*dpr:0);
  const R = Math.min(w,h)*0.48*(zoom||1);
  function angFor(elon){ return -elon*DEG; }
  const {ringR} = drawWheelBase(ctxC, cx, cy, R, dpr);

  const visible = entries.filter(e=>activeMap[e.id]!==false);
  const n = visible.length;
  // re-spaces to use the full depth whenever fewer than the full picked set is
  // shown, rather than leaving a hidden person's ring as a dead gap
  function radiusFrac(i){
    if(n<=1) return 0.74;
    const outer=0.90, inner=0.38;
    return outer - (outer-inner)*(i/(n-1));
  }

  compareDotHitboxes = [];
  const anchorsByEntry = {};
  visible.forEach((entry,i)=>{
    const rad = ringR*radiusFrac(i);
    const anchors = {};
    Object.values(entry.state.bodies).filter(s=>s.elon!=null).forEach(s=>{
      const a = angFor(s.elon);
      const x = cx+Math.cos(a)*rad, y = cy+Math.sin(a)*rad;
      anchors[s.key] = {x,y};
      compareDotHitboxes.push({key:s.key, x:x/dpr, y:y/dpr});
    });
    anchorsByEntry[entry.id] = anchors;
  });

  // cross-chart aspect lines only — a tapped/hovered planet's slice fades in
  // via compareKeyAlpha, everyone else stays at 0 so the wheel starts (and
  // mostly stays) clean instead of a permanent tangle of every pair's lines
  computeCompareAspects().forEach(tr=>{
    const alpha = Math.max(ensureCompareAlpha(tr.t.key), ensureCompareAlpha(tr.n.key));
    if(alpha<=0.01) return;
    const p1 = anchorsByEntry[tr.entryA.id]?.[tr.t.key];
    const p2 = anchorsByEntry[tr.entryB.id]?.[tr.n.key];
    if(!p1||!p2) return;
    ctxC.strokeStyle = tr.aspect.color; ctxC.globalAlpha = alpha*0.8; ctxC.lineWidth = 1.6*dpr;
    ctxC.setLineDash((tr.aspect.dash||[]).map(d=>d*dpr));
    ctxC.beginPath(); ctxC.moveTo(p1.x,p1.y); ctxC.lineTo(p2.x,p2.y); ctxC.stroke();
    ctxC.setLineDash([]); ctxC.globalAlpha=1;
  });

  // dots on top of the lines — "clean wheel, only planets": no house numbers,
  // no degree text, just a colored dot + glyph per person per ring. Dimmed
  // (rather than hidden) when something else is focused so the fade reads as
  // a crossfade instead of a hard cut.
  visible.forEach(entry=>{
    const anchors = anchorsByEntry[entry.id];
    Object.values(entry.state.bodies).filter(s=>s.elon!=null).forEach(s=>{
      const p = anchors[s.key];
      const a = ensureCompareAlpha(s.key);
      const dimmed = compareEffectiveKey() ? (0.35 + 0.65*a) : 1;
      const dotR = 5*dpr;
      ctxC.save();
      ctxC.globalAlpha = dimmed;
      ctxC.fillStyle=entry.color; ctxC.shadowColor=entry.color; ctxC.shadowBlur=6*dpr+a*8*dpr;
      ctxC.beginPath(); ctxC.arc(p.x,p.y,dotR,0,7); ctxC.fill();
      ctxC.font=(13*dpr)+"px ui-monospace,'SF Mono',Menlo,monospace"; ctxC.fillStyle='#fff';
      fillGlyphCentered(ctxC, s.glyph, p.x, p.y);
      ctxC.restore();
    });
  });
}
